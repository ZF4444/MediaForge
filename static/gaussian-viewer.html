<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高斯泼溅查看器</title>
  <script type="module" crossorigin src="/static/dist/gaussian-viewer/main.js"></script>
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/http-CEdM5kwk.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/runninghub-client-ehJ7xLZZ.js">
  <link rel="stylesheet" crossorigin href="/static/dist/assets/gaussian-viewer-DCqZ16jC.css">
</head>
<body>
    <!-- 顶部加载工具栏（独立页专属） -->
    <div id="topBar">
        <span class="title">高斯泼溅查看器</span>
        <label class="file-btn" for="plyFileInput">打开 PLY 文件</label>
        <input id="plyFileInput" type="file" accept=".ply" class="viewer-display-none">
        <input id="plyUrlInput" type="text" placeholder="或粘贴 PLY 文件链接…">
        <button id="loadUrlBtn" class="secondary" type="button">从链接加载</button>
        <span id="fileName"></span>
    </div>

    <div id="mainSplit">
        <!-- 右栏：高斯查看器 -->
        <div id="rightViewer">
    <div id="viewerContainer">
        <div id="canvasWrapper">
            <canvas id="canvas"></canvas>
            <img id="overlayImage" class="viewer-overlay-image">
            <div id="cropFrame" aria-hidden="true"></div>
        </div>

        <div id="dropHint">
            <div class="big">将 .ply 高斯泼溅文件拖入此处</div>
            <div class="sub">或点击左上角「打开 PLY 文件」</div>
        </div>

        <div id="loading" class="hidden">正在加载模型…</div>
        <div id="error" class="error hidden"></div>

        <div id="infoPanel" class="info-panel hidden">
            <div id="infoContent"></div>
        </div>

        <div id="ratioPanel" class="ratio-panel" aria-label="画幅比例预设">
            <div class="label">画幅比例</div>
            <select id="ratioSelect" class="ratio-select">
                <option value="source">原图</option>
                <option value="1:1">1:1</option>
                <option value="1:2">1:2</option>
                <option value="4:3">4:3</option>
                <option value="3:4">3:4</option>
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
            </select>
        </div>

        <div id="cameraInfo" class="info-panel camera-info-panel">
            <div id="cameraInfoContent"></div>
        </div>

        <div id="helpPanel" class="info-panel hidden help-panel">
            <div class="help-panel-title">键盘快捷键</div>
            <div class="help-panel-grid">
                <span class="help-key">WASD / 方向键</span> <span>移动 / 平移</span>
                <span class="help-key">Q / E</span> <span>偏航 (左/右)</span>
                <span class="help-key">R / F</span> <span>俯仰 (上/下)</span>
                <span class="help-key">Z / C</span> <span>翻滚</span>
                <span class="help-key">Shift</span> <span>精确模式 (0.1x)</span>
                <span class="help-key">左键</span> <span>环绕旋转</span>
                <span class="help-key">右键</span> <span>平移</span>
                <span class="help-key">滚轮</span> <span>缩放</span>
            </div>
            <button id="closeHelp" class="help-panel-close">关闭</button>
        </div>
    </div>

        <div id="controlsBar">
        <div class="control-group view-group">
            <span class="group-label">视角</span>
            <button id="resetCamera" title="重置相机视角">重置视角</button>
            <button id="toggleHelp" title="显示键盘快捷键">?</button>
        </div>

        <div class="control-group camera-group">
            <span class="group-label">相机</span>
            <div class="scale-control">
                <span>焦距:</span>
                <input type="range" id="focalScale" min="0.2" max="3.0" step="0.01" value="1.9" title="焦距缩放">
                <input type="number" id="focalScaleValue" min="0.2" max="3.0" step="0.01" value="1.9" title="焦距缩放值">
            </div>
        </div>

        <div class="control-group display-group">
            <span class="group-label">显示</span>
            <div class="scale-control">
                <span>清晰度:</span>
                <input type="range" id="gaussianScaleValue" min="1" max="30" step="1" value="4" title="高斯点清晰度">
                <span id="gaussianScaleDisplay">4</span>
                <button id="autoScaleBtn" title="恢复默认清晰度 (4)">默认</button>
            </div>
            <div id="overlayControl" class="scale-control">
                <span>叠图:</span>
                <input type="range" id="overlayAlpha" min="0" max="1" step="0.01" value="0.5" title="叠加图透明度">
                <input type="number" id="overlayAlphaValue" min="0" max="1" step="0.01" value="0.5" title="叠加图透明度值">
            </div>
        </div>
    </div>
        </div><!-- /#rightViewer -->
    </div><!-- /#mainSplit -->

    <!-- 页面内确认对话框 -->
    <div id="confirmOverlay">
        <div id="confirmPanel">
            <div id="confirmTitle">确认</div>
            <div id="confirmMessage"></div>
            <div id="confirmActions">
                <button id="confirmCancel">取消</button>
                <button id="confirmOk">确认</button>
            </div>
        </div>
    </div>

</body>
</html>
