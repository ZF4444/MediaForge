<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>画布管理</title>
    <script>(function(){try{if((localStorage.getItem('studio_theme')||localStorage.getItem('canvas_theme'))==='dark')document.documentElement.classList.add('theme-dark')}catch(e){}})();</script>
    <script src="/static/vendor/js/lucide.js"></script>
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/canvas-manager.css">
</head>
<body>
    <div class="workspace-shell">
      <aside class="workspace-sidebar" aria-label="工作区导航">
        <a class="brand-mark" href="/static/index.html" aria-label="返回工作台"><i data-lucide="circle-dot"></i></a>
        <div class="sidebar-label">工作区</div>
        <nav class="workspace-nav">
          <a class="nav-link" href="/static/index.html"><i data-lucide="layout-dashboard"></i><span>概览</span></a>
          <a class="nav-link active" href="/static/canvas-manager.html" aria-current="page"><i data-lucide="sparkles"></i><span>创作画布</span></a>
          <a class="nav-link" href="/static/asset-manager.html"><i data-lucide="square-stack"></i><span>素材库</span></a>
        </nav>
        <div class="sidebar-label tools-label">工具</div>
        <nav class="workspace-nav">
          <a class="nav-link" href="/static/gpt-chat.html"><i data-lucide="message-circle"></i><span>AI 对话</span></a>
          <a class="nav-link" href="/static/workflow-settings.html"><i data-lucide="workflow"></i><span>工作流</span></a>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="creator-chip"><span class="creator-avatar"></span><div><strong>创作者</strong><small>个人工作区</small></div></div>
      </aside>
      <main class="canvas-manager">
        <header class="manager-header">
            <div class="manager-heading"><div class="heading-mark"><i data-lucide="layers-3"></i></div><div><p class="manager-eyebrow">WORKSPACE / CANVASES</p><h1>画布管理</h1><p class="manager-subtitle">把灵感整理成可继续的创作空间。</p></div></div>
            <div class="manager-header-actions"><button id="importBtn" class="icon-button" type="button" title="导入画布模板" aria-label="导入画布模板"><i data-lucide="upload"></i></button><input id="importInput" type="file" accept=".json,.zip,application/json,application/zip" hidden><button id="refreshBtn" class="icon-button" type="button" title="刷新画布列表" aria-label="刷新画布列表"><i data-lucide="refresh-cw"></i></button></div>
        </header>
        <section class="create-panel" aria-label="新建画布">
            <div class="create-panel-copy"><i data-lucide="sparkles"></i><span>新建画布</span></div>
            <form id="createForm" class="create-form">
                <label class="sr-only" for="canvasTitleInput">画布名称</label>
                <input id="canvasTitleInput" type="text" maxlength="80" placeholder="输入画布名称（可选）" autocomplete="off">
                <button class="create-button" type="submit"><i data-lucide="plus"></i><span>创建</span></button>
            </form>
        </section>
        <div class="list-toolbar"><div class="list-heading"><span>我的画布</span><span id="canvasCount" class="canvas-count">0</span></div><label class="search-field"><i data-lucide="search"></i><span class="sr-only">搜索画布</span><input id="canvasSearch" type="search" placeholder="搜索画布" autocomplete="off"></label><label class="sort-field"><span class="sr-only">排序</span><select id="canvasSort"><option value="updated">最近编辑</option><option value="created">最近创建</option><option value="title">名称</option></select><i data-lucide="chevron-down"></i></label></div>
        <section id="canvasList" class="canvas-list" aria-live="polite"></section>
      </main>
    </div>
    <script src="/static/js/canvas-manager.js"></script>
</body>
</html>
