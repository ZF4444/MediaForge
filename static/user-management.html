<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <script>
        try { if ((localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark') === 'dark') document.documentElement.classList.add('theme-dark'); } catch(e) {}
    </script>
    <script src="/static/vendor/js/lucide.js"></script>
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg,#f5f6f8);color:var(--text,#16191f);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
        .shell{height:100%;display:flex;flex-direction:column}.head{padding:24px 28px 0;border-bottom:1px solid var(--border,#e4e7ec);background:var(--panel,#fff)}
        .title-row{display:flex;align-items:center;justify-content:space-between;gap:16px}.title{font-size:22px;font-weight:750}.count{font-size:12px;color:var(--faint,#667085)}
        .tabs{display:flex;gap:4px;margin-top:20px;overflow:auto}.tab{height:42px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--faint,#667085);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}.tab svg{width:16px;height:16px}.tab:hover{color:var(--text,#16191f)}.tab.active{color:var(--text,#16191f);border-bottom-color:var(--text,#16191f)}
        .content{flex:1;min-height:0;position:relative}.view{display:none;height:100%}.view.active{display:block}.embed{width:100%;height:100%;border:0;background:var(--bg,#f5f6f8)}
        .users{height:100%;overflow:auto;padding:24px 28px 48px;max-width:1180px;margin:0 auto}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.section-title{font-size:14px;font-weight:700}.search{width:min(320px,55vw);height:38px;padding:0 12px;border:1px solid var(--border,#d0d5dd);background:var(--panel,#fff);color:var(--text,#16191f);font-size:13px;outline:none}.search:focus{border-color:var(--text,#16191f)}
        .table{border-top:1px solid var(--border,#e4e7ec)}.row{display:grid;grid-template-columns:minmax(160px,1fr) minmax(180px,1.3fr) 130px minmax(160px,1fr) 58px;align-items:center;gap:16px;min-height:62px;padding:10px 12px;border-bottom:1px solid var(--border,#e4e7ec)}.row.header{min-height:40px;color:var(--faint,#667085);font-size:11px;font-weight:700;text-transform:uppercase}.user{font-size:13px;font-weight:650}.id{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--faint,#667085)}.badge{justify-self:start;padding:3px 8px;border:1px solid var(--border,#d0d5dd);font-size:11px;color:var(--faint,#667085)}.empty{text-align:center;padding:70px 20px;color:var(--faint,#667085);font-size:13px}.user-delete{width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;color:#b42318;cursor:pointer}.user-delete:hover{background:#fef3f2}.user-delete svg{width:15px;height:15px}
        .org-select{width:100%;max-width:220px;height:34px;padding:0 8px;border:1px solid var(--border,#d0d5dd);background:var(--panel,#fff);color:var(--text,#16191f);font-size:12.5px;outline:none}.org-select:focus{border-color:var(--text,#16191f)}
        .org-panel{border:1px solid var(--border,#e4e7ec);background:var(--panel,#fff);padding:14px 16px;margin-bottom:18px}.org-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.org-panel-title{font-size:13px;font-weight:700}.org-form{display:flex;gap:8px}.org-input{flex:1;max-width:260px;height:34px;padding:0 10px;border:1px solid var(--border,#d0d5dd);background:var(--panel,#fff);color:var(--text,#16191f);font-size:13px;outline:none}.org-input:focus{border-color:var(--text,#16191f)}
        .org-btn{height:34px;padding:0 14px;border:1px solid var(--text,#16191f);background:var(--text,#16191f);color:var(--panel,#fff);font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.org-btn:hover{opacity:.88}.org-btn:disabled{opacity:.5;cursor:not-allowed}
        .org-list{display:flex;flex-wrap:wrap;gap:8px}.org-chip{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border:1px solid var(--border,#e4e7ec);font-size:12.5px}.org-chip-name{font-weight:600}.org-chip-count{color:var(--faint,#667085);font-size:11px}.org-chip-actions{display:flex;gap:2px}.org-chip-btn{width:24px;height:24px;display:grid;place-items:center;border:0;background:transparent;color:var(--faint,#667085);cursor:pointer}.org-chip-btn:hover{color:var(--text,#16191f)}.org-chip-btn svg{width:14px;height:14px}
        .org-empty{font-size:12.5px;color:var(--faint,#667085)}
        .usage{height:100%;overflow:auto;padding:24px 28px 48px;max-width:1180px;margin:0 auto}.usage-toolbar{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:18px}.usage-toolbar h2{font-size:15px;margin:0}.usage-toolbar p{font-size:12px;color:var(--faint,#667085);margin:5px 0 0}.month-input{height:34px;border:1px solid var(--border,#d0d5dd);padding:0 9px;background:var(--panel,#fff);color:var(--text,#16191f);font-size:12px}.usage-summary{margin-bottom:24px}.usage-summary-title{font-size:13px;font-weight:700;margin:0 0 9px}.usage-summary + .usage-summary{margin-top:22px}.usage-summary-table{border-top:1px solid var(--border,#e4e7ec)}.usage-summary-line{display:grid;grid-template-columns:minmax(180px,1.35fr) minmax(120px,1fr) 120px 100px;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--border,#e4e7ec);font-size:12px}.usage-summary-line.personal{grid-template-columns:minmax(180px,1.35fr) minmax(120px,1fr) minmax(140px,1fr)}.usage-summary-line.header{font-size:11px;color:var(--faint,#667085);font-weight:700}.usage-summary-note{margin-top:3px;color:var(--faint,#667085);font-size:11px}.usage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:10px;margin-bottom:24px}.budget-row{border:1px solid var(--border,#e4e7ec);background:var(--panel,#fff);padding:14px}.budget-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.budget-name{font-size:13px;font-weight:700}.budget-state{font-size:11px;color:var(--faint,#667085)}.budget-money{font-size:20px;font-weight:750;margin:13px 0 4px}.budget-meta{font-size:11px;color:var(--faint,#667085)}.budget-progress{height:5px;background:var(--bg,#f5f6f8);margin:12px 0}.budget-progress i{display:block;height:100%;background:#20745a}.budget-progress.over i{background:#b42318}.budget-edit{display:grid;grid-template-columns:1fr auto auto;gap:7px;margin-top:12px}.budget-edit input{min-width:0;height:30px;border:1px solid var(--border,#d0d5dd);background:var(--panel,#fff);color:var(--text,#16191f);padding:0 8px;font-size:12px}.budget-toggle{display:flex;align-items:center;gap:5px;font-size:11px;white-space:nowrap}.budget-save{width:30px;height:30px;border:1px solid var(--text,#16191f);background:var(--text,#16191f);color:var(--panel,#fff);display:grid;place-items:center;cursor:pointer}.budget-save svg{width:14px;height:14px}.usage-table{border-top:1px solid var(--border,#e4e7ec)}.usage-line{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(120px,1fr) 100px 100px 90px 130px;gap:12px;padding:10px 8px;align-items:center;border-bottom:1px solid var(--border,#e4e7ec);font-size:12px}.usage-line.header{font-size:11px;color:var(--faint,#667085);font-weight:700}.usage-task{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--faint,#667085);margin-top:3px}.usage-status{font-size:11px}.usage-status.succeeded{color:#087443}.usage-status.failed{color:#b42318}.usage-empty{padding:38px 0;text-align:center;color:var(--faint,#667085);font-size:13px}
        .placeholder{height:100%;display:grid;place-items:center;padding:28px}.placeholder-inner{text-align:center;max-width:420px}.placeholder-icon{width:44px;height:44px;margin:0 auto 16px;color:var(--faint,#667085)}.placeholder-title{font-size:16px;font-weight:700}.placeholder-copy{margin-top:8px;font-size:13px;line-height:1.7;color:var(--faint,#667085)}
        .sessions{height:100%;overflow:auto;padding:24px 28px 48px;max-width:1180px;margin:0 auto}.session-toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:18px}.session-toolbar h2{font-size:15px;margin:0}.session-toolbar p{font-size:12px;color:var(--faint,#667085);margin:5px 0 0}.session-actions{display:flex;align-items:center;gap:10px}.session-filter{display:flex;align-items:center;gap:7px;color:var(--faint,#667085);font-size:12px}.session-refresh{width:34px;height:34px;border:1px solid var(--border,#d0d5dd);background:var(--panel,#fff);color:var(--text,#16191f);display:grid;place-items:center;cursor:pointer}.session-refresh:active{transform:scale(.95)}.session-refresh svg{width:15px;height:15px}.session-table{border-top:1px solid var(--border,#e4e7ec)}.session-row{display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(170px,1.1fr) 150px 150px 100px;gap:14px;align-items:center;min-height:68px;padding:10px 8px;border-bottom:1px solid var(--border,#e4e7ec);font-size:12px}.session-row.header{min-height:40px;color:var(--faint,#667085);font-size:11px;font-weight:700}.session-user{font-weight:650}.session-id{margin-top:3px;color:var(--faint,#667085);font:10px "JetBrains Mono",monospace}.session-status{display:inline-flex;align-items:center;gap:6px;color:var(--faint,#667085)}.session-status::before{content:"";width:7px;height:7px;border-radius:50%;background:#98a2b3}.session-status.online{color:#087443}.session-status.online::before{background:#18a566;box-shadow:0 0 0 3px rgba(24,165,102,.12)}.session-current{display:inline-block;margin-left:7px;padding:2px 6px;border:1px solid rgba(24,165,102,.3);color:#087443;font-size:10px;font-weight:600}.session-muted{color:var(--faint,#667085)}
        @media(prefers-reduced-motion:reduce){.session-refresh:active{transform:none}}
        .status{font-size:12px;color:var(--faint,#667085)}
        @media(max-width:680px){.head{padding:18px 16px 0}.users,.usage{padding:18px 16px 36px}.row{grid-template-columns:1fr 100px 34px}.row>*:nth-child(2),.row>*:nth-child(4){display:none}.toolbar,.usage-toolbar{align-items:flex-start;flex-direction:column}.search{width:100%}.org-form{flex-wrap:wrap}.usage-summary-line{grid-template-columns:1fr 100px}.usage-summary-line>*:nth-child(3),.usage-summary-line>*:nth-child(4){display:none}.usage-line{grid-template-columns:1fr 85px 80px}.usage-line>*:nth-child(2),.usage-line>*:nth-child(5),.usage-line>*:nth-child(6){display:none}}
        .usage-line{grid-template-columns:minmax(150px,1.1fr) minmax(170px,1.25fr) minmax(120px,1fr) 90px 100px 90px 130px}
        @media(max-width:680px){.usage-line{grid-template-columns:1fr 85px 80px}.usage-line>*:nth-child(2),.usage-line>*:nth-child(5),.usage-line>*:nth-child(6),.usage-line>*:nth-child(7){display:none}}
    </style>
</head>
<body>
<div class="shell">
    <header class="head">
        <div class="title-row"><div class="title">用户管理</div><div id="userCount" class="count"></div></div>
        <nav class="tabs" aria-label="用户管理视图">
            <button class="tab active" data-tab="users"><i data-lucide="users"></i>用户列表</button>
            <button class="tab" data-tab="access"><i data-lucide="shield-check"></i>权限管理</button>
            <button class="tab" data-tab="quota"><i data-lucide="database"></i>存储配额</button>
            <button class="tab" data-tab="sessions"><i data-lucide="monitor-smartphone"></i>登录会话</button>
            <button class="tab" data-tab="usage"><i data-lucide="chart-no-axes-column"></i>使用统计</button>
            <button class="tab" data-tab="budgets"><i data-lucide="wallet-cards"></i>预算配置</button>
        </nav>
    </header>
    <main class="content">
        <section class="view active" data-view="users">
            <div class="users">
                <div class="org-panel">
                    <div class="org-panel-head">
                        <div class="org-panel-title">组织</div>
                        <div id="orgStatus" class="status"></div>
                    </div>
                    <form id="orgForm" class="org-form">
                        <input id="orgNameInput" class="org-input" type="text" placeholder="新建组织名称" maxlength="60">
                        <button type="submit" class="org-btn"><i data-lucide="plus"></i>创建组织</button>
                    </form>
                    <div id="orgList" class="org-list" style="margin-top:12px"></div>
                </div>
                <div class="toolbar"><div><div class="section-title">注册用户</div><div id="status" class="status">加载中...</div></div><input id="search" class="search" type="search" placeholder="搜索用户名或用户 ID"></div>
                <div id="userTable" class="table"></div>
            </div>
        </section>
        <section class="view" data-view="access"><iframe class="embed" data-src="/static/access-control.html" title="权限管理"></iframe></section>
        <section class="view" data-view="quota"><iframe class="embed" data-src="/static/storage-quota.html" title="存储配额"></iframe></section>
        <section class="view" data-view="sessions"><div class="sessions"><div class="session-toolbar"><div><h2>登录会话</h2><p id="sessionStatus">查看当前在线用户和最近活动时间</p></div><div class="session-actions"><label class="session-filter"><input id="onlineOnly" type="checkbox"> 仅在线</label><button id="refreshSessions" class="session-refresh" type="button" title="刷新会话"><i data-lucide="refresh-cw"></i></button></div></div><div id="sessionTable" class="session-table"></div></div></section>
        <section class="view" data-view="usage"><div class="usage"><div class="usage-toolbar"><div><h2>使用统计</h2><p id="usageStatus">所有费用按 USD 结算</p></div><div style="display:flex;gap:8px;align-items:center"><button id="syncOmnilojo" class="budget-save" type="button" title="刷新用量"><i data-lucide="refresh-cw"></i></button><input id="usageMonth" class="month-input" type="month"></div></div><div id="usageSummary"></div><div class="usage-summary-title">使用明细</div><div id="usageTable" class="usage-table"></div></div></section>
        <section class="view" data-view="budgets"><div class="usage"><div class="usage-toolbar"><div><h2>预算配置</h2><p id="budgetStatus">所有预算按 USD 设置</p></div></div><div class="budget-row" style="margin-bottom:18px"><div class="budget-head"><span class="budget-name">新用户默认预算</span><span class="budget-state">仅影响之后新建的用户</span></div><div class="budget-meta" style="margin-top:6px">新用户首次创建时自动写入个人月度预算。</div><div class="budget-edit"><input id="newUserBudgetInput" type="number" min="0" step="0.0001" placeholder="月度预算（USD）"><label class="budget-toggle"><input id="newUserBudgetEnabled" type="checkbox">启用</label><button id="newUserBudgetSave" class="budget-save" type="button" title="保存新用户默认预算"><i data-lucide="check"></i></button></div></div><div class="section-title" style="margin-bottom:10px">组织预算</div><div id="budgetGrid" class="usage-grid"></div><div class="section-title" style="margin:26px 0 10px">个人预算</div><div id="personalBudgetGrid" class="usage-grid"></div></div></section>
    </main>
</div>
<script>
(() => {
    const state = { users: [], orgs: [], types: {}, userTypes: {}, query: '', usage: null };
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    function orgName(orgId){
        const org = state.orgs.find(o => o.id === orgId);
        return org ? org.name : '';
    }
    function renderUsers(){
        const q = state.query.trim().toLowerCase();
        const users = q ? state.users.filter(u => `${u.username || ''} ${u.user_id || ''}`.toLowerCase().includes(q)) : state.users;
        document.getElementById('userCount').textContent = `${state.users.length} 位用户`;
        const orgOptions = state.orgs.map(o => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join('');
        const typeOptions = Object.entries(state.types).map(([id, type]) => `<option value="${esc(id)}">${esc(type.name || id)}</option>`).join('');
        document.getElementById('userTable').innerHTML = `<div class="row header"><div>用户</div><div>用户 ID</div><div>账号类型</div><div>组织</div><div>操作</div></div>${users.map(u => {
            const orgSelect = `<select class="org-select" data-user="${esc(u.user_id)}"><option value="">未分配</option>${orgOptions}</select>`;
            const userType = state.userTypes[u.user_id] || 'new-user';
            const typeSelect = `<select class="org-select" data-user-type="${esc(u.user_id)}">${typeOptions}</select>`;
            const deleteButton = `<button type="button" class="user-delete" data-user-delete="${esc(u.user_id)}" title="删除用户"><i data-lucide="trash-2"></i></button>`;
            return `<div class="row"><div class="user">${esc(u.username || u.user_id)}</div><div class="id">${esc(u.user_id)}</div><div>${typeSelect}</div><div>${orgSelect}</div><div>${deleteButton}</div></div>`;
        }).join('') || '<div class="empty">没有匹配的用户</div>'}`;
        document.querySelectorAll('[data-user-type]').forEach(sel => {
            const uid = sel.dataset.userType;
            sel.value = state.userTypes[uid] || 'new-user';
            sel.addEventListener('change', () => assignUserType(uid, sel.value));
        });
        document.querySelectorAll('.org-select').forEach(sel => {
            const uid = sel.dataset.user;
            const user = state.users.find(u => u.user_id === uid);
            sel.value = (user && user.org_id) || '';
            sel.addEventListener('change', () => assignUserOrg(uid, sel.value || null));
        });
        document.querySelectorAll('[data-user-delete]').forEach(button => {
            button.addEventListener('click', () => deleteUser(button.dataset.userDelete));
        });
        if(window.lucide) lucide.createIcons();
    }
    function renderOrgs(){
        document.getElementById('orgList').innerHTML = state.orgs.length ? state.orgs.map(o => `
            <div class="org-chip" data-org="${esc(o.id)}">
                <span class="org-chip-name">${esc(o.name)}</span>
                <span class="org-chip-count">${o.member_count} 人</span>
                <span class="org-chip-actions">
                    <button type="button" class="org-chip-btn" data-action="rename" title="重命名"><i data-lucide="pencil"></i></button>
                    <button type="button" class="org-chip-btn" data-action="delete" title="删除"><i data-lucide="trash-2"></i></button>
                </span>
            </div>`).join('') : '<div class="org-empty">还没有组织，创建一个用于分组管理用户。</div>';
        document.querySelectorAll('.org-chip').forEach(chip => {
            const orgId = chip.dataset.org;
            chip.querySelector('[data-action="rename"]').addEventListener('click', () => renameOrg(orgId));
            chip.querySelector('[data-action="delete"]').addEventListener('click', () => deleteOrg(orgId));
        });
        if(window.lucide) lucide.createIcons();
    }
    async function loadUsers(){
        try { const r = await fetch('/api/access-control/users'); const d = await r.json(); if(!r.ok) throw new Error(d.detail || '加载失败'); state.users = d.users || []; state.types = d.types || {}; state.userTypes = d.user_types || {}; document.getElementById('status').textContent = ''; renderUsers(); }
        catch(e){ document.getElementById('status').textContent = e.message || '加载失败'; }
    }
    async function loadOrgs(){
        try { const r = await fetch('/api/organizations'); const d = await r.json(); if(!r.ok) throw new Error(d.detail || '加载失败'); state.orgs = d.organizations || []; renderOrgs(); renderUsers(); }
        catch(e){ document.getElementById('orgStatus').textContent = e.message || '加载失败'; }
    }
    async function createOrg(name){
        const status = document.getElementById('orgStatus');
        status.textContent = '创建中...';
        try {
            const r = await fetch('/api/organizations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }) });
            const d = await r.json();
            if(!r.ok) throw new Error(d.detail || '创建失败');
            status.textContent = '已创建';
            await loadOrgs();
        } catch(e){ status.textContent = e.message || '创建失败'; }
    }
    async function renameOrg(orgId){
        const current = orgName(orgId);
        const next = window.prompt('重命名组织', current);
        if(next == null) return;
        const trimmed = next.trim();
        if(!trimmed || trimmed === current) return;
        const status = document.getElementById('orgStatus');
        try {
            const r = await fetch(`/api/organizations/${encodeURIComponent(orgId)}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: trimmed }) });
            const d = await r.json();
            if(!r.ok) throw new Error(d.detail || '重命名失败');
            await loadOrgs();
        } catch(e){ status.textContent = e.message || '重命名失败'; }
    }
    async function deleteOrg(orgId){
        const name = orgName(orgId);
        if(!window.confirm(`删除组织「${name}」？成员将解除归属，不会被删除。`)) return;
        const status = document.getElementById('orgStatus');
        try {
            const r = await fetch(`/api/organizations/${encodeURIComponent(orgId)}`, { method: 'DELETE' });
            const d = await r.json();
            if(!r.ok) throw new Error(d.detail || '删除失败');
            await Promise.all([loadOrgs(), loadUsers()]);
        } catch(e){ status.textContent = e.message || '删除失败'; }
    }
    async function assignUserOrg(userId, orgId){
        const status = document.getElementById('status');
        try {
            const r = await fetch(`/api/access-control/users/${encodeURIComponent(userId)}/org`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ org_id: orgId }) });
            const d = await r.json();
            if(!r.ok) throw new Error(d.detail || '分配失败');
            await Promise.all([loadUsers(), loadOrgs()]);
        } catch(e){ status.textContent = e.message || '分配失败'; }
    }
    async function assignUserType(userId, typeId){
        const status = document.getElementById('status');
        try {
            const r = await fetch(`/api/access-control/users/${encodeURIComponent(userId)}/type`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type_id: typeId }) });
            const d = await r.json();
            if(!r.ok) throw new Error(d.detail || '分配失败');
            state.userTypes[userId] = d.user_type;
            status.textContent = '用户类型已更新';
        } catch(e){ status.textContent = e.message || '分配失败'; await loadUsers(); }
    }
    async function deleteUser(userId){
        const user = state.users.find(item => item.user_id === userId);
        const name = user?.username || userId;
        if(!window.confirm(`删除用户「${name}」？该用户将无法继续登录，历史用量记录会保留。`)) return;
        const status = document.getElementById('status');
        status.textContent = '删除中...';
        try {
            const r = await fetch(`/api/access-control/users/${encodeURIComponent(userId)}`, { method: 'DELETE' });
            const d = await r.json();
            if(!r.ok) throw new Error(d.detail || '删除失败');
            await Promise.all([loadUsers(), loadOrgs()]);
            status.textContent = '用户已删除';
        } catch(e){ status.textContent = e.message || '删除失败'; }
    }
    const money = value => `$${Number(value || 0).toFixed(4)}`;
    const moneyUsd = value => `$${Number(value || 0).toFixed(4)}`;
    const dateTime = value => value ? new Date(Number(value)).toLocaleString('zh-CN', {hour12:false}) : '—';
    function renderUsage(){
        const data = state.usage;
        const usageTable = document.getElementById('usageTable');
        const usageSummary = document.getElementById('usageSummary');
        if(!data){ usageSummary.innerHTML = ''; usageTable.innerHTML = ''; return; }
        const organizations = data.organizations || [];
        const users = data.user_budgets || [];
        usageSummary.innerHTML = `<section class="usage-summary"><h3 class="usage-summary-title">组织汇总</h3><div class="usage-summary-table"><div class="usage-summary-line header"><div>组织</div><div>消耗</div><div>RunningHub 用量</div><div>任务数</div></div>${organizations.map(org => `<div class="usage-summary-line"><div><strong>${esc(org.name)}</strong></div><div>${moneyUsd(org.spent_cny)}</div><div>${Number(org.consume_coins || 0).toFixed(2)} RH币</div><div>${Number(org.task_count || 0)}</div></div>`).join('') || '<div class="usage-empty">暂无组织消耗记录</div>'}</div></section><section class="usage-summary"><h3 class="usage-summary-title">个人汇总</h3><div class="usage-summary-table"><div class="usage-summary-line personal header"><div>用户</div><div>消耗</div><div>组织</div></div>${users.map(user => `<div class="usage-summary-line personal"><div><strong>${esc(user.username || user.user_id)}</strong><div class="usage-summary-note">${esc(user.user_id)}</div></div><div>${moneyUsd(user.spent_usd)}</div><div>${esc(user.organization_name || '未分配')}</div></div>`).join('') || '<div class="usage-empty">暂无个人消耗记录</div>'}</div></section>`;
        const rhRecords = (data.records || []).map(item => ({...item, source:'RunningHub', reference:item.upstream_task_id, units:`${Number(item.consume_coins || 0).toFixed(2)} RH币`, timestamp:item.completed_at || item.submitted_at}));
        const omniRecords = (data.omnilojo?.records || []).map(item => ({...item, source:'Omnilojo', reference:item.request_id || item.upstream_request_id || item.upstream_log_id, status:'succeeded', units:`输入 ${Number(item.prompt_tokens || 0)} / 输出 ${Number(item.completion_tokens || 0)} token`, timestamp:item.created_at}));
        const records = [...rhRecords, ...omniRecords].sort((a,b) => Number(b.timestamp || 0) - Number(a.timestamp || 0));
        usageTable.innerHTML = `<div class="usage-line header"><div>用户 / 来源</div><div>连接 / 模型 / 资源</div><div>组织</div><div>状态</div><div>费用</div><div>用量</div><div>时间</div></div>${records.map(item => `<div class="usage-line"><div><strong>${esc(item.username || item.user_id || '未分配')}</strong><div class="usage-task">${esc(item.source)} · ${esc(item.reference || '')}</div></div><div><strong>${esc(item.connection_name || '未指定连接')}</strong><div class="usage-task">模型：${esc(item.model_name || item.model || '—')}${item.model_id ? ` · ${esc(item.model_id)}` : ''}</div>${item.resource_name || item.resource_id ? `<div class="usage-task">资源：${esc(item.resource_name || item.resource_id)}</div>` : ''}</div><div>${esc(item.organization_name || '未分配')}</div><div class="usage-status ${esc(item.status)}">${esc(item.status)}</div><div>${item.source === 'Omnilojo' ? moneyUsd(item.cost_usd) : money(item.total_money_cny)}</div><div>${esc(item.units)}</div><div>${dateTime(item.timestamp)}</div></div>`).join('') || '<div class="usage-empty">这个月还没有使用记录</div>'}`;
    }
    function renderBudgets(){
        const data = state.usage;
        const budgetGrid = document.getElementById('budgetGrid');
        const personalBudgetGrid = document.getElementById('personalBudgetGrid');
        if(!data){ budgetGrid.innerHTML = ''; personalBudgetGrid.innerHTML = ''; return; }
        budgetGrid.innerHTML = (data.organizations || []).map(org => {
            const budget = Number(org.monthly_budget_cny || 0);
            const spent = Number(org.spent_cny || 0);
            const pct = budget > 0 ? Math.min(100, spent / budget * 100) : 0;
            const over = budget > 0 && spent >= budget;
            return `<article class="budget-row"><div class="budget-head"><span class="budget-name">${esc(org.name)}</span><span class="budget-state">${org.budget_enabled ? '预算已启用' : '未启用预算'}</span></div><div class="budget-money">${money(spent)}</div><div class="budget-meta">预算 ${budget ? money(budget) : '未设置'} · ${Number(org.consume_coins || 0).toFixed(2)} RH币 · ${org.task_count} 个任务</div><div class="budget-progress ${over ? 'over' : ''}"><i style="width:${pct}%"></i></div><div class="budget-edit"><input type="number" min="0" step="0.0001" value="${budget || ''}" placeholder="月度预算（USD）" data-budget-input="${esc(org.id)}"><label class="budget-toggle"><input type="checkbox" data-budget-enabled="${esc(org.id)}" ${org.budget_enabled ? 'checked' : ''}>启用</label><button class="budget-save" type="button" data-budget-save="${esc(org.id)}" title="保存预算"><i data-lucide="check"></i></button></div></article>`;
        }).join('') || '<div class="usage-empty">暂无组织</div>';
        personalBudgetGrid.innerHTML = (data.user_budgets || []).map(user => {
            const budget = Number(user.monthly_budget_usd || 0);
            const spent = Number(user.spent_usd || 0);
            const pct = budget > 0 ? Math.min(100, spent / budget * 100) : 0;
            const over = budget > 0 && spent >= budget;
            return `<article class="budget-row"><div class="budget-head"><span class="budget-name">${esc(user.username || user.user_id)}</span><span class="budget-state">${user.budget_enabled ? '预算已启用' : '未启用预算'}</span></div><div class="budget-money">${money(spent)}</div><div class="budget-meta">${esc(user.organization_name || '未分配')} · 预算 ${budget ? money(budget) : '未设置'}</div><div class="budget-progress ${over ? 'over' : ''}"><i style="width:${pct}%"></i></div><div class="budget-edit"><input type="number" min="0" step="0.0001" value="${budget || ''}" placeholder="月度预算（USD）" data-user-budget-input="${esc(user.user_id)}"><label class="budget-toggle"><input type="checkbox" data-user-budget-enabled="${esc(user.user_id)}" ${user.budget_enabled ? 'checked' : ''}>启用</label><button class="budget-save" type="button" data-user-budget-save="${esc(user.user_id)}" title="保存预算"><i data-lucide="check"></i></button></div></article>`;
        }).join('') || '<div class="usage-empty">暂无用户</div>';
        document.querySelectorAll('[data-budget-save]').forEach(button => button.addEventListener('click', () => saveBudget(button.dataset.budgetSave)));
        document.querySelectorAll('[data-user-budget-save]').forEach(button => button.addEventListener('click', () => saveUserBudget(button.dataset.userBudgetSave)));
        if(window.lucide) lucide.createIcons();
    }
    async function loadUsage(){
        const month = document.getElementById('usageMonth').value;
        const status = document.getElementById('usageStatus');
        status.textContent = '加载中...';
        try { const [rh, omni, defaults] = await Promise.all([fetch(`/api/usage/runninghub?month=${encodeURIComponent(month)}`), fetch(`/api/usage/omnilojo?month=${encodeURIComponent(month)}`), fetch('/api/settings/new-user-budget')]); const d = await rh.json(); const omnilojo = await omni.json().catch(() => ({detail:`Omnilojo 接口错误（HTTP ${omni.status}）`})); if(!rh.ok) throw new Error(d.detail || '加载失败'); if(defaults.ok){ const cfg = await defaults.json(); document.getElementById('newUserBudgetInput').value = Number(cfg.monthly_budget_usd || 0) || ''; document.getElementById('newUserBudgetEnabled').checked = cfg.enabled !== false; } state.usage = {...d, omnilojo: omni.ok ? omnilojo : {records:[]}}; status.textContent = omni.ok ? '所有费用按 USD 结算' : `Omnilojo 统计不可用：${omnilojo.detail || '请求失败'}`; const budgetStatus = document.getElementById('budgetStatus'); if(budgetStatus) budgetStatus.textContent = omni.ok ? '所有预算按 USD 设置' : '部分统计不可用'; renderUsage(); renderBudgets(); }
        catch(e){ status.textContent = e.message || '加载失败'; }
    }
    async function saveBudget(orgId){
        const input = document.querySelector(`[data-budget-input="${CSS.escape(orgId)}"]`);
        const enabled = document.querySelector(`[data-budget-enabled="${CSS.escape(orgId)}"]`);
        const status = document.getElementById('budgetStatus');
        const amount = Number(input?.value || 0);
        if(!Number.isFinite(amount) || amount < 0){ status.textContent = '预算金额必须为非负数'; return; }
        try { const r = await fetch(`/api/organizations/${encodeURIComponent(orgId)}/budget`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({monthly_budget_cny:amount, enabled:Boolean(enabled?.checked)})}); const d = await r.json(); if(!r.ok) throw new Error(d.detail || '保存失败'); await loadUsage(); }
        catch(e){ status.textContent = e.message || '保存失败'; }
    }
    async function saveUserBudget(userId){
        const input = document.querySelector(`[data-user-budget-input="${CSS.escape(userId)}"]`);
        const enabled = document.querySelector(`[data-user-budget-enabled="${CSS.escape(userId)}"]`);
        const status = document.getElementById('budgetStatus');
        const amount = Number(input?.value || 0);
        if(!Number.isFinite(amount) || amount < 0){ status.textContent = '预算金额必须为非负数'; return; }
        try { const r = await fetch(`/api/users/${encodeURIComponent(userId)}/budget`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({monthly_budget_usd:amount, enabled:Boolean(enabled?.checked)})}); const d = await r.json(); if(!r.ok) throw new Error(d.detail || '保存失败'); await loadUsage(); }
        catch(e){ status.textContent = e.message || '保存失败'; }
    }
    async function saveNewUserBudget(){
        const amount = Number(document.getElementById('newUserBudgetInput').value || 0);
        const enabled = document.getElementById('newUserBudgetEnabled').checked;
        const status = document.getElementById('budgetStatus');
        if(!Number.isFinite(amount) || amount < 0){ status.textContent = '预算金额必须为非负数'; return; }
        try { const r = await fetch('/api/settings/new-user-budget', {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({monthly_budget_usd:amount, enabled})}); const d = await r.json(); if(!r.ok) throw new Error(d.detail || '保存失败'); status.textContent = '新用户默认预算已保存'; }
        catch(e){ status.textContent = e.message || '保存失败'; }
    }
    function renderSessions(){
        const rows = (state.sessions || []).filter(item => !document.getElementById('onlineOnly').checked || item.online);
        const table = document.getElementById('sessionTable');
        table.innerHTML = `<div class="session-row header"><div>用户</div><div>状态</div><div>最后活动</div><div>登录时间</div><div>有效期至</div></div>${rows.map(item => `<div class="session-row"><div><div class="session-user">${esc(item.username)}${item.is_current ? '<span class="session-current">当前会话</span>' : ''}</div><div class="session-id">${esc(item.user_id)} · ${esc(item.session_id)}</div></div><div><span class="session-status ${item.online ? 'online' : ''}">${item.online ? '在线' : '离线'}</span></div><div>${dateTime(item.last_seen)}</div><div>${dateTime(item.created_at)}</div><div class="session-muted">${dateTime(item.expires_at)}</div></div>`).join('') || '<div class="empty">暂无登录会话</div>'}`;
        if(window.lucide) lucide.createIcons();
    }
    async function loadSessions(){
        const status = document.getElementById('sessionStatus');
        status.textContent = '加载中...';
        try { const r = await fetch('/api/access-control/sessions'); const d = await r.json(); if(!r.ok) throw new Error(d.detail || '加载失败'); state.sessions = d.sessions || []; status.textContent = `${d.online_count || 0} 位在线用户 · 最近 ${d.online_window_minutes || 5} 分钟有活动`; renderSessions(); }
        catch(e){ status.textContent = e.message || '加载失败'; document.getElementById('sessionTable').innerHTML = '<div class="empty">会话数据暂时不可用</div>'; }
    }
    function activate(name){
        document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === name));
        document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.dataset.view === name));
        const frame = document.querySelector(`[data-view="${name}"] iframe[data-src]`);
        if(frame && !frame.src) frame.src = frame.dataset.src;
        if(name === 'usage' || name === 'budgets') loadUsage();
        if(name === 'sessions') loadSessions();
        history.replaceState(null, '', `#${name}`);
    }
    document.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => activate(el.dataset.tab)));
    document.getElementById('search').addEventListener('input', e => { state.query = e.target.value || ''; renderUsers(); });
    document.getElementById('orgForm').addEventListener('submit', e => {
        e.preventDefault();
        const input = document.getElementById('orgNameInput');
        const name = (input.value || '').trim();
        if(!name) return;
        input.value = '';
        createOrg(name);
    });
    document.getElementById('usageMonth').value = new Date().toISOString().slice(0, 7);
    document.getElementById('usageMonth').addEventListener('change', loadUsage);
    document.getElementById('syncOmnilojo').addEventListener('click', loadUsage);
    document.getElementById('newUserBudgetSave').addEventListener('click', saveNewUserBudget);
    document.getElementById('refreshSessions').addEventListener('click', loadSessions);
    document.getElementById('onlineOnly').addEventListener('change', renderSessions);
    const initial = ['users','access','quota','sessions','usage','budgets'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'users';
    activate(initial); loadOrgs(); loadUsers(); if(window.lucide) lucide.createIcons();
})();
</script>
</body>
</html>
