<body>
    <div class="page">
        <div class="wrap">
            <header class="page-head">
                <div>
                    <div class="title" data-i18n="comfy.title">ComfyUI工作流</div>
                    <div class="sub" data-i18n="comfy.subtitle">选择本地 ComfyUI 工作流，配置可暴露到画布的输入参数。</div>
                </div>
                <div id="status" class="status"></div>
            </header>

            <div class="layout">
                <aside class="sidebar">
                    <div class="side-card" id="previewCard">
                        <div class="preview-title-row">
                            <i data-lucide="eye" class="w-4 h-4 icon-muted"></i>
                            <div class="preview-title" data-i18n="comfy.nodePreview">画布节点预览</div>
                            <div class="preview-pill" data-i18n="comfy.live">实时</div>
                        </div>
                        <div class="preview-desc" data-i18n="comfy.previewDesc">这个工作流在画布 Comfy 节点上将显示出的控件，可直接填写并点击「运行测试」。</div>
                        <div id="previewContent">
                            <div class="preview-empty" data-i18n="comfy.previewEmpty">勾选节点输入字段后<br>预览将出现在这里</div>
                        </div>
                    </div>
                </aside>

                <main class="content">
                    <div id="graphCard" class="graph-card page-display-none">
                        <div class="graph-head">
                            <div class="graph-title-row">
                                <div class="workflow-title-column">
                                    <div class="title-edit-row">
                                        <input id="workflowTitleInput" class="workflow-title-input" type="text" placeholder="工作流名称" data-i18n-placeholder="comfy.workflowName" data-action="updateWorkflowTitle" data-action-value="true">
                                    </div>
                                    <div id="editorSub" class="editor-sub" data-i18n="comfy.editorSubDefault">从左侧列表选择，或上传新的 API 工作流</div>
                                </div>
                                <div class="content-actions">
                                    <button id="saveBtn" class="action-btn save-btn page-display-none" type="button" data-action="onSave">
                                        <i data-lucide="save" class="w-3.5 h-3.5"></i><span data-i18n="comfy.saveConfig">保存配置</span>
                                    </button>
                                </div>
                            </div>
                            <div class="workspace-mode-tabs">
                                <button id="workspaceGraphTab" type="button" class="active" data-action="setWorkspaceMode" data-action-arg="graph" data-i18n="comfy.workflow">工作流</button>
                                <button id="workspaceCanvasTab" type="button" data-action="setWorkspaceMode" data-action-arg="canvas" data-i18n="comfy.testCanvas">测试画布</button>
                            </div>
                        </div>
                        <div class="graph-svg-wrap graph-svg-wrap-relative">
                            <svg id="graphSvg" class="graph-svg"></svg>
                            <div class="graph-controls">
                                <div class="graph-ctrl-btn" data-action="graphZoom" data-action-arg="-1" title="缩小" data-i18n-title="canvas.decrease"><i data-lucide="zoom-out" class="w-4 h-4"></i></div>
                                <div id="zoomPill" class="graph-zoom-pill">100%</div>
                                <div class="graph-ctrl-btn" data-action="graphZoom" data-action-arg="1" title="放大" data-i18n-title="canvas.increase"><i data-lucide="zoom-in" class="w-4 h-4"></i></div>
                                <div class="graph-ctrl-btn" data-action="graphFit" title="适应窗口"><i data-lucide="maximize" class="w-4 h-4"></i></div>
                            </div>
                            <div id="popupBackdrop" class="popup-backdrop page-display-none" data-action="closeNodePopup"></div>
                            <div id="nodePopup" class="popup-panel page-display-none"></div>
                        </div>
                        <div id="miniCanvasHost" class="page-display-none"></div>
                    </div>
                    <div id="nodesToggle" class="nodes-toggle page-display-none" data-action="toggleNodeList">
                        <i data-lucide="list" class="w-3.5 h-3.5"></i>
                        <span id="nodesToggleText" data-i18n="comfy.showNodeList">显示完整节点列表</span>
                    </div>
                    <div id="nodeList" class="node-list hidden"></div>
                </main>

            </div>
        </div>
    </div>
    <div id="imageLightbox" class="image-lightbox" data-action="closeImagePreview">
        <img id="imageLightboxImg" src="" alt="preview" data-stop-propagation>
    </div>

</body>
</html>
