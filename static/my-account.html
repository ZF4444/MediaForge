<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的账户</title>
    <script src="/static/vendor/js/lucide.js"></script>
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/css/theme.css">
    <style>
        *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg,#f5f6f8);color:var(--text,#16191f);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.account{max-width:1040px;margin:0 auto;padding:32px 28px 48px}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.title{font-size:22px;font-weight:750}.subtitle{margin-top:5px;color:var(--faint,#667085);font-size:13px}.refresh{width:34px;height:34px;border:1px solid var(--border,#d0d5dd);background:var(--panel,#fff);color:var(--text,#16191f);display:grid;place-items:center;cursor:pointer}.refresh:hover,.action:hover{border-color:var(--text,#16191f)}.refresh svg{width:16px;height:16px}.profile{display:flex;align-items:center;gap:14px;padding:18px 0;border-top:1px solid var(--border,#e4e7ec);border-bottom:1px solid var(--border,#e4e7ec)}.avatar{width:42px;height:42px;display:grid;place-items:center;background:#0f766e;color:#fff;font-size:16px;font-weight:750}.profile-name{font-size:15px;font-weight:750}.profile-meta{margin-top:4px;color:var(--faint,#667085);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:24px 0}.metric{min-height:126px;padding:16px;border:1px solid var(--border,#e4e7ec);background:var(--panel,#fff)}.metric-label{color:var(--faint,#667085);font-size:12px}.metric-value{margin-top:13px;font-size:25px;font-weight:750}.metric-detail{margin-top:6px;color:var(--faint,#667085);font-size:12px;line-height:1.45}.bar{height:5px;background:var(--bg,#f5f6f8);margin-top:14px}.bar i{display:block;height:100%;background:#0f766e}.section{margin-top:30px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.section-title{font-size:14px;font-weight:750}.section-note{color:var(--faint,#667085);font-size:12px}.action{height:32px;padding:0 10px;border:1px solid var(--border,#d0d5dd);background:var(--panel,#fff);color:var(--text,#16191f);font-size:12px;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;gap:6px}.action svg{width:14px;height:14px}.table{border-top:1px solid var(--border,#e4e7ec)}.line{display:grid;grid-template-columns:minmax(180px,1.15fr) minmax(180px,1.2fr) 100px 105px 135px;gap:12px;align-items:center;padding:11px 8px;border-bottom:1px solid var(--border,#e4e7ec);font-size:12px}.line.header{color:var(--faint,#667085);font-size:11px;font-weight:700}.reference{margin-top:3px;color:var(--faint,#667085);font-family:"JetBrains Mono",monospace;font-size:10px}.detail{margin-top:3px;color:var(--faint,#667085);font-size:11px}.status{font-size:11px}.status.succeeded{color:#087443}.status.failed{color:#b42318}.empty{padding:34px 8px;color:var(--faint,#667085);font-size:13px}.error{padding:14px;border:1px solid #fecdca;background:#fffbfa;color:#b42318;font-size:13px}.skeleton{color:var(--faint,#667085);font-size:13px;padding:20px 0}@media(max-width:700px){.account{padding:24px 16px 36px}.metrics{grid-template-columns:1fr}.line{grid-template-columns:1fr 95px}.line>*:nth-child(3),.line>*:nth-child(4),.line>*:nth-child(5){display:none}.section-head{align-items:flex-start;flex-direction:column}.profile{align-items:flex-start}}
    </style>
</head>
<body>
    <main class="account">
        <div class="topline"><div><div class="title">我的账户</div><div class="subtitle" id="period">本月账户概览</div></div><button id="refresh" class="refresh" type="button" title="刷新"><i data-lucide="refresh-cw"></i></button></div>
        <section id="profile" class="profile"><div class="avatar">...</div><div><div class="profile-name">加载中...</div></div></section>
        <div id="content" class="skeleton">正在读取账户信息...</div>
    </main>
    <script>
    (() => {
        const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
        const money = value => `$${Number(value || 0).toFixed(4)}`;
        const bytes = value => { const size=Number(value || 0); if(size < 1024) return `${size} B`; const units=['KB','MB','GB','TB']; let amount=size; let index=-1; do { amount/=1024; index++; } while(amount >= 1024 && index < units.length - 1); return `${amount.toFixed(amount >= 10 ? 1 : 2)} ${units[index]}`; };
        const timestamp = value => value ? new Date(Number(value)).toLocaleString('zh-CN', {hour12:false}) : '—';
        function render(data){
            const profile = data.account?.profile || {};
            const spending = data.account?.spending || {};
            const organization = data.account?.organization;
            const storage = data.storage || {};
            const name = profile.username || profile.user_id || '当前用户';
            const budget = Number(spending.monthly_budget_usd || 0);
            const spent = Number(spending.total_usd || 0);
            const pct = budget > 0 ? Math.min(100, spent / budget * 100) : 0;
            document.getElementById('period').textContent = `${data.account?.month || ''} 账户概览`;
            document.getElementById('profile').innerHTML = `<div class="avatar">${esc(name.slice(0, 1).toUpperCase())}</div><div><div class="profile-name">${esc(name)}</div><div class="profile-meta">${esc(profile.user_id || '')} · ${esc(profile.organization_name || '未分配组织')}</div></div>`;
            const records = data.account?.records || [];
            const organizationCard = organization ? `<article class="metric"><div class="metric-label">组织本月总消耗</div><div class="metric-value">${money(organization.total_usd)}</div><div class="metric-detail">${esc(organization.name)} · ${Number(organization.task_count || 0)} 个任务 · ${Number(organization.request_count || 0)} 次请求</div></article>` : '';
            const budgetCard = spending.budget_enabled && budget > 0 ? `<article class="metric"><div class="metric-label">个人预算</div><div class="metric-value">${money(budget)}</div><div class="metric-detail">已使用 ${money(spent)} · 剩余 ${money(Math.max(0, budget - spent))}</div><div class="bar"><i style="width:${pct}%"></i></div></article>` : '';
            document.getElementById('content').innerHTML = `<section class="metrics"><article class="metric"><div class="metric-label">本月消耗</div><div class="metric-value">${money(spent)}</div><div class="metric-detail">RunningHub ${money(spending.runninghub_usd)} · Omnilojo ${money(spending.omnilojo_usd)}</div></article><article class="metric"><div class="metric-label">我的存储</div><div class="metric-value">${bytes(storage.used_bytes)}</div><div class="metric-detail">${storage.quota_bytes > 0 ? `剩余 ${bytes(storage.remaining_bytes)} · ` : ''}${Number(storage.total_files || 0)} 个文件</div><div class="bar"><i style="width:${storage.quota_bytes > 0 ? Math.min(100, Number(storage.used_bytes || 0) / Number(storage.quota_bytes) * 100) : 0}%"></i></div></article><article class="metric"><div class="metric-label">本月活动</div><div class="metric-value">${Number(spending.task_count || 0) + Number(spending.request_count || 0)}</div><div class="metric-detail">${Number(spending.task_count || 0)} 个生成任务 · ${Number(spending.request_count || 0)} 次模型请求<br>${Number(spending.runninghub_coins || 0).toFixed(2)} RH币</div></article>${organizationCard}${budgetCard}</section><section class="section"><div class="section-head"><div><div class="section-title">近期使用记录</div><div class="section-note">仅展示当前账户的使用情况</div></div><button id="openStorage" class="action" type="button"><i data-lucide="folder-open"></i>查看我的文件</button></div><div class="table"><div class="line header"><div>来源 / 任务</div><div>连接 / 模型 / 资源</div><div>状态</div><div>消耗</div><div>时间</div></div>${records.map(item => `<div class="line"><div><strong>${esc(item.source)}</strong><div class="reference">${esc(item.reference || item.model || '—')}</div></div><div><strong>${esc(item.connection_name || '未指定连接')}</strong><div class="detail">模型：${esc(item.model_name || item.model || '—')}${item.model_id ? ` · ${esc(item.model_id)}` : ''}</div>${item.resource_name || item.resource_id ? `<div class="detail">资源：${esc(item.resource_name || item.resource_id)}</div>` : ''}</div><div class="status ${esc(item.status || '')}">${esc(item.status || '—')}</div><div>${money(item.cost_usd)}</div><div>${timestamp(item.timestamp)}</div></div>`).join('') || '<div class="empty">本月还没有使用记录</div>'}</div></section>`;
            document.getElementById('openStorage').addEventListener('click', () => parent.postMessage({type:'studio-open-asset-storage'}, location.origin));
            if(window.lucide) lucide.createIcons();
        }
        async function load(){
            const content = document.getElementById('content');
            content.className = 'skeleton'; content.textContent = '正在读取账户信息...';
            try {
                const [accountResponse, storageResponse] = await Promise.all([fetch('/api/account/overview'), fetch('/api/storage/usage')]);
                const account = await accountResponse.json(); const storage = await storageResponse.json();
                if(!accountResponse.ok) throw new Error(account.detail || '账户信息加载失败');
                if(!storageResponse.ok) throw new Error(storage.detail || '存储信息加载失败');
                content.className = ''; render({account, storage});
            } catch(error) { content.className = 'error'; content.textContent = error.message || '账户信息加载失败'; }
        }
        document.getElementById('refresh').addEventListener('click', load);
        window.addEventListener('message', event => {
            if (event.origin !== location.origin || event.data?.type !== 'account-focus') return;
            load();
        });
        load(); if(window.lucide) lucide.createIcons();
    })();
    </script>
</body>
</html>
