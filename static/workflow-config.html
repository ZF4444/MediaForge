<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>工作流配置</title><script src="/static/js/theme.js"></script><link rel="stylesheet" href="/static/css/theme.css"><link rel="stylesheet" href="/static/css/workflow-settings.css"></head><body><main class="workflow-config-view"><div class="config-toolbar"><button id="backToListBtn" class="back-btn">← 返回列表</button><div id="configTitle" class="config-title">工作流配置</div><button id="saveMetaBtn" class="save-meta-btn">保存设置</button></div><div class="config-meta"><label class="meta-field"><span>工作流来源</span><select id="workflowSource"><option value="comfyui">ComfyUI 工作流</option><option value="runninghub">RH 应用</option></select></label><div class="meta-field"><span>媒体类型</span><div class="segmented"><button type="button" data-media="image" class="active">图片</button><button type="button" data-media="video">视频</button></div></div><div id="comfyUploadMeta" class="meta-field"><span>工作流文件</span><label class="upload-meta-btn"><span>上传 JSON</span><input id="workflowUploadInput" type="file" accept="application/json"></label></div><div id="rhUrlMeta" class="meta-field" hidden><span>RH应用ID</span><div class="rh-url-row"><input id="rhAppUrlInput" class="rh-url-input" placeholder="输入 RH 应用 ID"><button id="openRhUrlBtn" class="upload-meta-btn" type="button">打开应用</button></div></div><div id="configHint" class="config-hint">选择来源后，在下方配置具体工作流。</div></div><div class="embedded-config"><iframe id="workflowConfigFrame" title="工作流具体配置"></iframe></div></main><script src="/static/js/workflow-config.js"></script></body></html>
