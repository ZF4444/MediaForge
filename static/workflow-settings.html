<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作流设置</title>
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/workflow-settings.css">
</head>
<body>
    <main class="workflow-settings-shell">
        <header class="workflow-settings-head">
            <div class="head-copy">
                <div class="eyebrow">WORKFLOW SETTINGS</div>
                <h1>工作流设置</h1>
                <p>统一管理 ComfyUI 工作流与 RH 应用。</p>
            </div>
            <button id="newWorkflowBtn" class="primary-btn" type="button"><span class="plus">+</span> 新建工作流</button>
        </header>

        <section id="workflowListView" class="workflow-list-view">
            <div class="list-toolbar">
                <div><h2>工作流列表</h2><span id="workflowCount" class="list-count">0 个</span></div>
                <button id="refreshWorkflowsBtn" class="icon-btn" type="button" title="刷新">↻</button>
            </div>
            <div id="workflowList" class="workflow-grid" aria-live="polite"></div>
        </section>
    </main>
    <script src="/static/dist/workflow-settings/main.js"></script>
</body>
</html>
