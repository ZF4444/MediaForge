<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作流设置</title>
  <script type="module" crossorigin src="/static/dist/workflow-settings/main.js"></script>
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/http-CEdM5kwk.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/createElement-Dtn2c4iX.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/lucide-ITmwDkJS.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/theme-bootstrap-xndVsk9N.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/trash-Cx7YPRpD.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/refresh-cw-Cl2IWWPq.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/plus-tks1q2ic.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/circle-check-Dr9Q9HjR.js">
  <link rel="stylesheet" crossorigin href="/static/dist/assets/workflow-settings-Blv3m2b1.css">
  <link rel="stylesheet" crossorigin href="/static/dist/assets/theme-C30F1HGx.css">
</head>
<body>
  <main class="workflow-settings-shell">
    <header class="workflow-settings-head">
      <div class="head-copy">
        <div class="eyebrow"><span class="eyebrow-dot"></span>工作区设置</div>
        <h1>工作流</h1>
        <p>集中管理可用于画布生成的工作流与 AI 应用。</p>
      </div>
      <div class="head-actions">
        <span class="head-status"><i data-lucide="check-circle-2"></i>服务正常</span>
        <button id="newWorkflowBtn" class="primary-btn" type="button"><i data-lucide="plus"></i><span>新建工作流</span></button>
      </div>
    </header>
    <section id="workflowListView" class="workflow-list-view">
      <div class="list-toolbar">
        <div><h2>工作流列表</h2><span id="workflowCount" class="list-count">0 个</span><p>启用后才会出现在画布的生成选择中</p></div>
        <button id="refreshWorkflowsBtn" class="icon-btn" type="button" title="刷新工作流" aria-label="刷新工作流"><i data-lucide="refresh-cw"></i></button>
      </div>
      <div id="workflowList" class="workflow-grid" aria-live="polite"></div>
    </section>
  </main>
</body>
</html>
