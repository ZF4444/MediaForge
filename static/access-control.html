<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>权限管理</title>
  <script>(function(){try{var t=localStorage.getItem('studio_theme')||localStorage.getItem('canvas_theme')||'light';if(t==='dark')document.documentElement.classList.add('studio-theme-dark','theme-dark')}catch(e){}})();</script>
  <script src="/static/vendor/js/lucide.js"></script>
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/theme.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg, #f5f6f8); color: var(--text, #1a1f29); }
    button, input, select { font: inherit; }
    .ac-wrap { max-width: 1220px; margin: 0 auto; padding: 30px 24px 64px; }
    .ac-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding-bottom: 22px; border-bottom: 1px solid var(--border, #e5e7eb); }
    .ac-title { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 700; }
    .ac-sub { max-width: 680px; margin: 7px 0 0; color: var(--faint, #6b7280); font-size: 13px; line-height: 1.7; }
    .ac-head-actions { display: flex; align-items: center; justify-content: flex-end; gap: 12px; min-height: 38px; }
    .ac-status { color: var(--faint, #6b7280); font-size: 12.5px; white-space: nowrap; }
    .ac-status.ok { color: #15803d; }.ac-status.err { color: #dc2626; }
    .ac-save-btn, .ac-secondary-btn, .ac-danger-btn { border: 1px solid var(--border, #e5e7eb); border-radius: 6px; cursor: pointer; transition: background .15s, border-color .15s; }
    .ac-save-btn { min-height: 36px; padding: 0 16px; border-color: var(--text, #1a1f29); background: var(--text, #1a1f29); color: var(--bg, #fff); font-size: 13px; font-weight: 600; }
    .ac-save-btn:disabled { opacity: .55; cursor: wait; }.ac-secondary-btn { padding: 6px 10px; background: var(--panel, #fff); color: var(--text, #1a1f29); font-size: 12px; }.ac-secondary-btn:hover { background: var(--hover, #f3f4f6); }.ac-danger-btn { padding: 6px 10px; background: transparent; color: #dc2626; border-color: #fecaca; font-size: 12px; }.ac-danger-btn:hover { background: #fef2f2; }
    .ac-main { display: grid; gap: 22px; margin-top: 24px; }
    .ac-workspace { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 390px; background: var(--panel, #fff); border: 1px solid var(--border, #e5e7eb); border-radius: 8px; overflow: hidden; }
    .ac-type-pane { padding: 18px; border-right: 1px solid var(--border, #e5e7eb); background: color-mix(in srgb, var(--panel, #fff) 92%, var(--bg, #f5f6f8)); }
    .ac-pane-head, .ac-section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .ac-pane-title, .ac-section-title { font-size: 14px; font-weight: 700; }.ac-pane-note, .ac-hint { margin: 5px 0 0; color: var(--faint, #6b7280); font-size: 12px; line-height: 1.5; }
    .ac-type-list { display: flex; flex-direction: column; gap: 5px; margin-top: 16px; }
    .ac-type-item { width: 100%; display: flex; align-items: center; gap: 9px; padding: 10px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--text, #1a1f29); cursor: pointer; text-align: left; font-size: 13px; }
    .ac-type-item:hover { background: var(--hover, #f3f4f6); }.ac-type-item.active { border-color: var(--border, #d1d5db); background: var(--panel, #fff); font-weight: 600; }.ac-type-dot { width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: #2563eb; }.ac-type-item.active .ac-type-dot { background: #16a34a; }
    .ac-editor { padding: 22px 24px; }.ac-empty { display: grid; min-height: 320px; place-items: center; color: var(--faint, #6b7280); font-size: 13px; text-align: center; }
    .ac-editor-title { margin: 0; font-size: 16px; font-weight: 700; }.ac-field { max-width: 460px; margin-top: 18px; }.ac-label { display: block; margin-bottom: 7px; color: var(--faint, #6b7280); font-size: 12px; }.ac-name-input { width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--border, #d1d5db); border-radius: 6px; background: var(--panel, #fff); color: var(--text, #1a1f29); }.ac-name-input:focus, .ac-type-select:focus { outline: 2px solid color-mix(in srgb, #2563eb 30%, transparent); border-color: #2563eb; }
    .ac-permissions { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border, #e5e7eb); }.ac-bulk { display: flex; gap: 6px; }.ac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 8px; margin-top: 14px; }.ac-check { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 10px; border: 1px solid var(--border, #e5e7eb); border-radius: 6px; cursor: pointer; font-size: 12.5px; }.ac-check:hover { background: var(--hover, #f9fafb); }.ac-check.checked { border-color: #2563eb; background: color-mix(in srgb, #2563eb 6%, var(--panel, #fff)); }.ac-check input { accent-color: #2563eb; }
    .ac-editor-foot { display: flex; align-items: center; gap: 12px; margin-top: 20px; }.ac-editor-foot .ac-hint { margin: 0; }
    .ac-assignment { padding: 20px 22px 6px; background: var(--panel, #fff); border: 1px solid var(--border, #e5e7eb); border-radius: 8px; }.ac-assignment-copy { margin: 5px 0 18px; color: var(--faint, #6b7280); font-size: 12px; }.ac-user-table { width: 100%; border-collapse: collapse; }.ac-user-table th, .ac-user-table td { padding: 11px 10px; border-top: 1px solid var(--border, #e5e7eb); text-align: left; font-size: 13px; }.ac-user-table th { color: var(--faint, #6b7280); font-size: 12px; font-weight: 500; }.ac-user-table th:last-child, .ac-user-table td:last-child { width: 250px; }.ac-user-name { font-weight: 500; }.ac-user-id { margin-top: 2px; color: var(--faint, #6b7280); font-size: 11.5px; }.ac-type-select { width: 100%; min-height: 34px; padding: 0 8px; border: 1px solid var(--border, #d1d5db); border-radius: 5px; background: var(--panel, #fff); color: var(--text, #1a1f29); font-size: 12.5px; }.ac-empty-row { padding: 24px 10px !important; color: var(--faint, #6b7280); text-align: center !important; }
    .ac-forbidden { padding: 56px 12px; text-align: center; color: var(--faint, #6b7280); font-size: 13px; }
    @media (max-width: 760px) { .ac-wrap { padding: 20px 14px 40px; }.ac-head { display: block; }.ac-head-actions { justify-content: space-between; margin-top: 16px; }.ac-workspace { grid-template-columns: 1fr; }.ac-type-pane { border-right: 0; border-bottom: 1px solid var(--border, #e5e7eb); }.ac-type-list { max-height: 190px; overflow: auto; }.ac-editor { padding: 18px 16px; }.ac-grid { grid-template-columns: 1fr; }.ac-assignment { padding: 18px 14px 4px; overflow-x: auto; }.ac-user-table { min-width: 520px; } }
  </style>
</head>
<body>
  <main class="ac-wrap">
    <header class="ac-head">
      <div><h1 class="ac-title">权限管理</h1><p class="ac-sub">通过用户类型统一配置可访问页面，再将用户分配到对应类型。未分配的用户使用“默认用户”类型，所有页面权限均由所属类型决定。</p></div>
      <div class="ac-head-actions"><span id="acStatus" class="ac-status" role="status"></span><button id="acSaveBtn" class="ac-save-btn" type="button">保存变更</button></div>
    </header>
    <div id="acMain" class="ac-main" style="display:none">
      <section class="ac-workspace" aria-label="用户类型权限配置">
        <aside class="ac-type-pane"><div class="ac-pane-head"><div class="ac-pane-title">用户类型</div><button id="acAddTypeBtn" class="ac-secondary-btn" type="button">新增类型</button></div><p class="ac-pane-note">选择一种类型，设置它可使用的页面。</p><div id="acTypeList" class="ac-type-list"></div></aside>
        <section class="ac-editor"><div id="acDetailEmpty" class="ac-empty">选择左侧的用户类型后，在这里配置页面权限。</div><div id="acDetail" style="display:none"><h2 id="acDetailTitle" class="ac-editor-title"></h2><div class="ac-field"><label class="ac-label" for="acTypeName">用户类型名称</label><input id="acTypeName" class="ac-name-input" maxlength="80"></div><section class="ac-permissions"><div class="ac-section-head"><div><div class="ac-section-title">可访问页面</div><p class="ac-hint">勾选后，该类型下的用户可以从侧边栏访问对应页面。</p></div><div class="ac-bulk"><button class="ac-secondary-btn" type="button" data-bulk="pages" data-val="all">全选</button><button class="ac-secondary-btn" type="button" data-bulk="pages" data-val="none">清空</button></div></div><div id="acPages" class="ac-grid"></div></section><div class="ac-editor-foot"><button id="acDeleteTypeBtn" class="ac-danger-btn" type="button">删除此类型</button><span class="ac-hint">删除后，关联用户会自动归入“默认用户”。</span></div></div></section>
      </section>
      <section class="ac-assignment" aria-label="用户类型分配"><div class="ac-section-title">用户类型分配</div><p class="ac-assignment-copy">为每个用户选择用户类型。修改会与页面权限配置一并保存。</p><table class="ac-user-table"><thead><tr><th>用户</th><th>用户类型</th></tr></thead><tbody id="acUserList"></tbody></table></section>
    </div>
    <div id="acForbidden" class="ac-forbidden" style="display:none">需要“用户管理”页面权限才能访问此页面。</div>
  </main>
  <script src="/static/access-control.page.js"></script>
</body>
</html>
