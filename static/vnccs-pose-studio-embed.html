<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNCCS 姿势工作室</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark';
                if(theme === 'dark') document.documentElement.classList.add('theme-dark');
            } catch(e) {}
        })();
    </script>
    <style>
        html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#1e1e1e; }
        body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        #host { width:100%; height:100%; min-width:0; min-height:0; position:relative; overflow:hidden; }
        #status {
            position:absolute;
            inset:0;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#d1d5db;
            background:#1e1e1e;
            font-size:12px;
            letter-spacing:.12em;
            text-transform:uppercase;
            z-index:10;
        }
        #status.error {
            color:#fecaca;
            padding:24px;
            text-align:center;
            line-height:1.8;
            text-transform:none;
            letter-spacing:0;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "../../scripts/app.js": "/static/js/vnccs-standalone-module.js",
                "../../scripts/api.js": "/static/js/vnccs-standalone-module.js",
                "https://esm.sh/three@0.160.0?dev": "/static/vendor/js/vnccs/three.module.js",
                "https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls?dev": "/static/vendor/js/vnccs/OrbitControls.js",
                "https://esm.sh/three@0.160.0/examples/jsm/controls/TransformControls?dev": "/static/vendor/js/vnccs/TransformControls.js"
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/macos-dark.css">
</head>
<body>
    <div id="host">
        <div id="status">Loading Pose Studio</div>
    </div>
    <script src="/static/js/vnccs-standalone-shim.js"></script>
    <script type="module" src="/static/js/vnccs-standalone-module.js"></script>
    <script type="module" src="/static/vendor/js/vnccs/vnccs_pose_studio.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const host = document.getElementById('host');
        window.addEventListener('vnccs-standalone-ready', event => {
            const node = event.detail?.node;
            const container = node?.studioWidget?.container;
            if(!container) return;
            host.appendChild(container);
            statusEl.style.display = 'none';
            const resize = () => {
                try {
                    node.size = [host.clientWidth || 1200, host.clientHeight || 820];
                    node.onResize?.(node.size);
                } catch(e) {}
            };
            new ResizeObserver(resize).observe(host);
            setTimeout(resize, 100);
            setTimeout(resize, 900);
        });
        window.addEventListener('vnccs-standalone-error', event => {
            statusEl.className = 'error';
            statusEl.textContent = `VNCCS 姿势工作室加载失败：${event.detail?.error?.message || event.detail?.error || '未知错误'}`;
        });
        window.addEventListener('error', event => {
            if(statusEl.style.display === 'none') return;
            statusEl.className = 'error';
            statusEl.textContent = `VNCCS 姿势工作室加载失败：${event.message || '脚本错误'}`;
        });
    </script>
</body>
</html>
