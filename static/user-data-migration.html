<!doctype html>
<html lang="zh-CN" class="theme-dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>用户数据迁移</title>
<script src="/static/vendor/js/lucide.js"></script><script src="/static/js/theme.js"></script>
<link rel="stylesheet" href="/static/css/theme.css"><link rel="stylesheet" href="/static/css/macos-dark.css">
<style>
:root{color-scheme:dark;--bg:#1c1c1e;--panel:rgba(44,44,46,.84);--line:rgba(255,255,255,.13);--text:#f5f5f7;--muted:#a1a1a6;--blue:#0a84ff}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:radial-gradient(ellipse 70% 55% at 78% -10%,rgba(57,75,105,.22),transparent 70%),var(--bg);color:var(--text);margin:0;min-height:100vh;padding:48px 24px}.panel{max-width:820px;margin:auto;padding:30px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 24px 60px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(28px) saturate(145%)}h1{font-size:26px;letter-spacing:-.03em;margin:0 0 9px}p{font-size:13px;line-height:1.7;color:var(--muted)}.intro{max-width:680px;margin:0}.form{display:flex;gap:9px;margin:26px 0 14px}.form input{min-width:0;flex:1;height:42px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:rgba(28,28,30,.86);color:var(--text);outline:0}.form input:focus{border-color:rgba(10,132,255,.75);box-shadow:0 0 0 3px rgba(10,132,255,.17)}.button{height:42px;border:1px solid var(--line);border-radius:11px;background:#323234;color:var(--text);padding:0 15px;font-size:13px;font-weight:700;cursor:pointer}.button:hover{background:#48484a}.button:disabled{opacity:.5;cursor:not-allowed}.button.primary{background:var(--blue);border-color:var(--blue);color:#fff}.status{min-height:22px;padding:4px 0;font-size:12px;color:var(--muted)}#list:empty{display:none}.canvas{padding:12px 0;border-bottom:1px solid var(--line)}.canvas strong{display:block;font-size:13px}.canvas span{font-size:11px;color:var(--muted)}.confirm{display:none;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}.confirm label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text)}.confirm input{accent-color:var(--blue)}.danger{margin-top:16px;background:#ff453a;border-color:#ff453a;color:#fff}.danger:hover{background:#ff6961}.help{margin-top:24px;font-size:11px;color:#8e8e93}@media(max-width:600px){body{padding:20px 14px}.panel{padding:22px 18px;border-radius:16px}.form{flex-direction:column}.button{width:100%}}
@media(prefers-reduced-transparency:reduce){.panel{backdrop-filter:none;background:#2c2c2e}}
</style>
</head>
<body><main class="panel"><h1>用户数据迁移</h1><p class="intro">将待迁移账号的业务数据迁移到当前飞书账号，完成后删除待迁移账号。预算、组织、访问权限和存储配额等管理配置不会迁移。</p><div class="form"><input id="username" placeholder="输入待迁移账号的用户名"><button id="lookup" class="button primary">查询账号</button></div><div id="status" class="status" role="status"></div><div id="list"></div><div id="confirm" class="confirm"><label><input id="check" type="checkbox">我已确认这是要迁移的账号</label><br><button id="execute" class="button danger" disabled>确认迁移并删除原账号</button></div><p class="help">迁移是不可逆操作。请在确认前核对账号和画布列表。</p></main>
<script>(()=>{let source=null;const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));$('lookup').onclick=async()=>{ $('status').textContent='查询中...';$('list').innerHTML='';$('confirm').style.display='none';try{const r=await fetch('/api/user-data-migration/source?username='+encodeURIComponent($('username').value));const d=await r.json();if(!r.ok)throw Error(d.detail||'查询失败');source=d.source;$('list').innerHTML='<p>账号：'+esc(source.username)+'（'+esc(source.user_id)+'）</p>'+((d.canvases||[]).map(c=>'<div class="canvas"><strong>'+esc(c.title||'未命名画布')+'</strong><span>'+new Date(Number(c.updated_at||c.created_at||0)).toLocaleString()+'</span></div>').join('')||'<p>该账号没有画布。</p>');$('confirm').style.display='block';$('status').textContent='请确认画布列表后继续。'}catch(e){$('status').textContent=e.message}};$('check').onchange=()=>{$('execute').disabled=!$('check').checked};$('execute').onclick=async()=>{if(!source)return;if(!confirm('迁移完成后账号 '+source.username+' 将被删除，确定继续吗？'))return;$('execute').disabled=true;$('status').textContent='迁移中...';try{const r=await fetch('/api/user-data-migration/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_user_id:source.user_id,confirmed:true})});const d=await r.json();if(!r.ok)throw Error(d.detail||'迁移失败');$('status').textContent='迁移完成，账号 '+source.username+' 已删除。';$('confirm').style.display='none'}catch(e){$('status').textContent=e.message;$('execute').disabled=false}};if(window.lucide)lucide.createIcons()})();</script></body></html>
