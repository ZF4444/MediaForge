<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户数据迁移</title><style>body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#16191f;margin:0;padding:28px}.panel{max-width:760px;margin:auto;background:#fff;border:1px solid #e4e7ec;padding:24px}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:#667085}.form{display:flex;gap:8px;margin:20px 0}.form input{flex:1;height:36px;border:1px solid #d0d5dd;padding:0 10px}.button{height:36px;border:1px solid #16191f;background:#16191f;color:#fff;padding:0 14px;cursor:pointer}.button:disabled{opacity:.5}.status{font-size:13px;margin:12px 0}.canvas{padding:10px 0;border-bottom:1px solid #e4e7ec}.canvas strong{display:block;font-size:13px}.canvas span{font-size:11px;color:#667085}.confirm{display:none;margin-top:20px;border-top:1px solid #e4e7ec;padding-top:16px}.danger{background:#b42318;border-color:#b42318}</style></head><body><main class="panel"><h1>用户数据迁移</h1><p>将待迁移账号的业务数据迁移到当前飞书账号，完成后删除待迁移账号。预算、组织、访问权限和存储配额等管理配置不会迁移。</p><div class="form"><input id="username" placeholder="输入待迁移账号的用户名"><button id="lookup" class="button">查询</button></div><div id="status" class="status"></div><div id="list"></div><div id="confirm" class="confirm"><label><input id="check" type="checkbox"> 我已确认这是要迁移的账号</label><br><button id="execute" class="button danger" disabled style="margin-top:12px">确认迁移</button></div></main><script>(()=>{let source=null;const $=id=>document.getElementById(id);$('lookup').onclick=async()=>{ $('status').textContent='查询中...';$('list').innerHTML='';$('confirm').style.display='none';try{const r=await fetch('/api/user-data-migration/source?username='+encodeURIComponent($('username').value));const d=await r.json();if(!r.ok)throw Error(d.detail||'查询失败');source=d.source;$('list').innerHTML='<p>账号：'+source.username+'（'+source.user_id+'）</p>'+((d.canvases||[]).map(c=>'<div class="canvas"><strong>'+String(c.title||'未命名画布').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))+'</strong><span>'+new Date(Number(c.updated_at||c.created_at||0)).toLocaleString()+'</span></div>').join('')||'<p>该账号没有画布。</p>');$('confirm').style.display='block';$('status').textContent='请确认画布列表。'}catch(e){$('status').textContent=e.message}};$('check').onchange=()=>{$('execute').disabled=!$('check').checked};$('execute').onclick=async()=>{if(!source)return;if(!confirm('迁移完成后账号 '+source.username+' 将被删除，确定继续吗？'))return;$('execute').disabled=true;$('status').textContent='迁移中...';try{const r=await fetch('/api/user-data-migration/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_user_id:source.user_id,confirmed:true})});const d=await r.json();if(!r.ok)throw Error(d.detail||'迁移失败');$('status').textContent='迁移完成，账号 '+source.username+' 已删除。';$('confirm').style.display='none'}catch(e){$('status').textContent=e.message;$('execute').disabled=false}}})();</script></body></html>
