<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>API 设置</title>
  <script type="module" crossorigin src="/static/dist/ai-connections/main.js"></script>
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/http-ImYglq-n.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/refresh-cw-c2tlqd9O.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/lucide-BkStV3v0.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/check-DJDPzImb.js">
  <link rel="modulepreload" crossorigin href="/static/dist/chunks/plus-tks1q2ic.js">
</head>
<body>
  <main class="api-page">
    <header class="api-header">
      <div>
        <p class="api-eyebrow">API 设置</p>
        <h1>Connections <span aria-hidden="true">·</span> Models</h1>
        <p class="api-subtitle">管理服务连接与可用模型，已有配置会被安全保留。</p>
      </div>
      <div class="api-header-actions">
        <span id="status" class="api-status" role="status" aria-live="polite"></span>
        <button id="refresh" class="api-button" type="button" aria-label="重新加载"><i data-lucide="refresh-cw"></i><span>重新加载</span></button>
        <button id="save" class="api-button api-button-primary" type="button" aria-label="保存配置"><i data-lucide="check"></i><span>保存配置</span></button>
      </div>
    </header>
    <nav class="api-tabs" aria-label="API 设置视图" role="tablist">
      <button class="api-tab active" id="tab-connections" data-tab="connections" role="tab" aria-selected="true" aria-controls="connections"><i data-lucide="plug-zap"></i><span>Connections</span><small id="connections-count">0</small></button>
      <button class="api-tab" id="tab-models" data-tab="models" role="tab" aria-selected="false" aria-controls="models"><i data-lucide="box"></i><span>Models</span><small id="models-count">0</small></button>
    </nav>
    <section class="api-workspace">
      <aside class="api-list-panel">
        <div class="api-list-head"><div><h2 id="list-title">Connections</h2><p id="list-subtitle">服务连接</p></div><button id="add-connection" class="api-icon-button" type="button" title="新增连接"><i data-lucide="plus"></i></button><button id="add-model" class="api-icon-button" type="button" title="新增模型" hidden><i data-lucide="plus"></i></button></div>
        <div id="connections" class="api-list" data-panel-list="connections"></div>
        <div id="models" class="api-list" data-panel-list="models" hidden></div>
      </aside>
      <section class="api-editor-panel" id="editor" aria-live="polite"></section>
    </section>
  </main>
</body>
</html>
