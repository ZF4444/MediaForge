<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>权限管理</title><link rel="stylesheet" href="./page.css"></head>
<body>
<main class="access-app">
  <header class="topbar"><div><p class="eyebrow">用户与访问</p><h1>权限管理</h1><p class="intro">为每一种用户类型，设定恰到好处的访问范围。</p></div><div class="save-actions"><span id="saveStatus" role="status" aria-live="polite">正在加载…</span><button id="resetButton" class="quiet" disabled>撤销更改</button><button id="saveButton" class="primary" disabled>保存更改</button></div></header>
  <div id="loadError" class="notice" hidden><p id="loadErrorText"></p><button id="retryButton" class="quiet">重新加载</button></div>
  <div id="loading" class="loading">正在读取用户类型与权限配置…</div>
  <div id="workspace" hidden>
    <section id="permissionsView" class="workspace" aria-label="类型与权限">
      <aside class="type-sidebar"><div class="sidebar-head"><h2>用户类型 <span id="typeCount" class="count"></span></h2><button id="addType" class="icon-button" aria-label="新增用户类型">+</button></div><label class="search"><span aria-hidden="true">⌕</span><input id="typeSearch" type="search" placeholder="搜索用户类型" aria-label="搜索用户类型"></label><div id="typeList" class="type-list"></div><p class="sidebar-note">未分配类型的用户，使用默认用户权限。</p></aside>
      <div class="editor"><div class="editor-heading"><div><p id="typeBadge" class="eyebrow"></p><h2 id="typeTitle"></h2><p id="typeSummary" class="muted"></p></div></div>
        <div class="type-settings"><div class="name-field"><label for="typeName">类型名称</label><input id="typeName" maxlength="80" autocomplete="off"><span id="nameError" class="field-error" hidden>请输入用户类型名称。</span></div><button id="deleteType" class="danger">删除类型</button></div>
        <div id="adminNotice" class="notice" hidden>系统管理员拥有全部页面和模型权限，新增资源也会自动开放。</div>
        <div class="permission-columns">
          <section class="permission-panel" aria-labelledby="pagesTitle"><div class="panel-heading"><div><h3 id="pagesTitle">可访问页面</h3><p class="muted">决定用户可以打开哪些工作空间。</p></div><span id="pageCount" class="permission-count"></span></div><div class="panel-toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="pageSearch" type="search" placeholder="搜索页面" aria-label="搜索页面"></label><button class="text-button" data-bulk="pages" data-value="all">全选</button><button class="text-button" data-bulk="pages" data-value="none">清空</button></div><div id="pageList" class="permission-list"></div></section>
          <section class="permission-panel" aria-labelledby="modelsTitle"><div class="panel-heading"><div><h3 id="modelsTitle">可访问模型</h3><p class="muted">与 API 设置中的模型保持同步。</p></div><span id="modelCount" class="permission-count"></span></div><div class="panel-toolbar"><label class="search"><span aria-hidden="true">⌕</span><input id="modelSearch" type="search" placeholder="搜索模型或连接" aria-label="搜索模型或连接"></label><button class="text-button" data-bulk="models" data-value="all">全选</button><button class="text-button" data-bulk="models" data-value="none">清空</button></div><label class="auto-access"><input id="allModels" type="checkbox"><span>允许全部模型<small>包含以后新增的模型</small></span></label><div id="modelList" class="permission-list"></div><div class="sync-footer"><span id="syncStatus" role="status">每 5 秒自动同步</span><button id="refreshModels" class="text-button">立即同步</button></div></section>
        </div>
      </div>
    </section>

  </div>
</main>
<dialog id="typeDialog"><form id="typeForm"><p class="eyebrow">用户类型</p><h2>创建新的访问范围</h2><p class="muted">新类型将复制“默认用户”的页面和模型权限，创建后可独立调整。</p><label class="dialog-field" for="newTypeName">类型名称<input id="newTypeName" maxlength="80" placeholder="例如：设计团队" required></label><div class="dialog-actions"><button id="cancelCreate" type="button" class="quiet">取消</button><button class="primary" type="submit">创建类型</button></div></form></dialog>
<script type="module" src="../../access-control/main.js"></script>
</body></html>
