<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>空间配额</title>
    <script type="module" src="../../storage-quota/main.js"></script>
</head>
<body>
    <div class="wrap">
        <header class="page-head">
            <div>
                <div class="title">空间配额</div>
                <div class="sub">管理员统一管理默认配额、单用户配额和空间使用情况。</div>
            </div>
            <div id="status" class="status">准备就绪</div>
        </header>
        <div class="layout">
            <aside class="panel sidebar">
                <div class="section-title">全局配置</div>
                <div class="card">
                    <label class="toggle-row">
                        <input id="quotaEnabled" type="checkbox">
                        <span>启用空间配额</span>
                    </label>
                    <div class="muted spaced-top">关闭后不做写入配额限制，但统计仍可查看。</div>
                </div>
                <div class="card">
                    <div class="muted">默认配额</div>
                    <div class="field-row spaced-top">
                        <input id="defaultQuotaGb" type="number" min="0" step="0.1" placeholder="例如 10">
                        <span>GB</span>
                    </div>
                    <div class="muted spaced-top">用户未单独配置时继承此值。留空表示不覆盖系统默认值。</div>
                </div>
                <div class="card">
                    <div class="section-title quick-title">快捷设置</div>
                    <div class="quick-actions">
                        <button class="quick" type="button" data-default-gb="2">2 GB</button>
                        <button class="quick" type="button" data-default-gb="5">5 GB</button>
                        <button class="quick" type="button" data-default-gb="10">10 GB</button>
                        <button class="quick" type="button" data-default-gb="">不限</button>
                    </div>
                </div>
                <div class="actions spaced-actions">
                    <button id="saveBtn" class="btn primary" type="button"><i data-lucide="save" class="w-4 h-4"></i><span>保存配置</span></button>
                    <button id="refreshBtn" class="btn" type="button"><i data-lucide="refresh-cw" class="w-4 h-4"></i><span>刷新</span></button>
                </div>
            </aside>
            <main class="panel content">
                <div class="summary-grid">
                    <div class="summary-card"><div class="summary-label">用户数</div><div id="summaryUsers" class="summary-value">0</div></div>
                    <div class="summary-card"><div class="summary-label">总已用空间</div><div id="summaryUsed" class="summary-value">0 GB</div></div>
                    <div class="summary-card"><div class="summary-label">默认配额</div><div id="summaryDefault" class="summary-value">不限</div></div>
                </div>
                <div class="toolbar">
                    <div>
                        <div class="section-title">用户配额</div>
                        <div class="muted toolbar-note">按已用空间排序，可直接编辑单用户配额。</div>
                    </div>
                    <div class="toolbar-right"><input id="searchInput" type="search" placeholder="搜索用户 ID / 用户名"></div>
                </div>
                <div class="table" id="userTable"></div>
            </main>
        </div>
    </div>
</body>
</html>
