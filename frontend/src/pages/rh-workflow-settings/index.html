<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RH 应用配置</title>
  <script type="module" blocking="render" src="/static/dist/shared/theme-bootstrap-early.js"></script>
  <script type="module" src="../../rh-workflow-settings/runtime.js"></script>
  <link rel="stylesheet" href="/static/dist/styles/theme.css">
  <link rel="stylesheet" href="/static/dist/styles/api-settings.css">
  <link rel="stylesheet" href="/static/dist/styles/rh-workflow-settings.css">
</head>
<body>
  <div class="rh-shell">
    <header class="rh-head"><div><h1>RH 应用</h1><p>管理 RunningHub 应用及其画布输入参数。</p></div><div id="status" class="status"></div></header>
    <div id="runninghubConfigBlock" class="block runninghub-config-block"><div class="block-head"><div><div class="block-title">AI 应用</div><div class="block-desc">粘贴运行路径后创建应用。</div></div></div><div class="rh-paste-row"><input id="rhPasteInput" class="rh-paste-input" placeholder="/run/ai-app/..."><button class="action-btn" data-action="createRhEntryFromPaste">+ 创建</button></div><div class="rh-card-columns"><div class="rh-group-head"><span>AI 应用</span><span id="rhAppsCount">0</span></div><div id="rhAppsList" class="rh-card-list"></div></div></div>
  </div>
  <div id="resourceList" hidden></div><main id="settingsContent" hidden><input id="nameInput"><input id="idInput"><input id="baseInput"><input id="protocolInput"><input id="keyInput"><span id="keyHint"></span><input id="rhFreeKeyInput"><span id="rhFreeKeyHint"></span><div id="connectionOnboardingCard"></div><div id="connectionBasicBlock"></div><div id="comfyBackendBlock"></div><div id="modelsHead"></div><div class="model-grid"></div><div id="modelConfigBlock"></div><div id="selectedModelIdField"></div><input id="selectedModelInput"><input id="selectedModelAliasInput"><input id="selectedModelProtocol"><div id="selectedModelProtocolField"></div><div id="selectedModelPriceFields"></div><input id="selectedModelInputPrice"><input id="selectedModelOutputPrice"><div id="imageModelList"></div><div id="chatModelList"></div><div id="videoModelList"></div></main>
  <div id="rhWorkflowEditorOverlay" class="rh-workflow-editor-overlay"><div class="rh-workflow-editor-modal">
    <div class="rh-workflow-editor-head">
      <div class="rh-workflow-editor-title-wrap"><div id="rhWorkflowEditorTitle" class="rh-workflow-editor-title">RH 应用</div><div id="rhWorkflowEditorSub" class="rh-workflow-editor-sub"></div></div>
      <div class="rh-workflow-editor-actions">
        <button class="action-btn" type="button" data-action="fetchRhAppEditor" data-action-arg="true" title="从 RunningHub 重新拉取参数"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i><span>重新拉取</span></button>
        <button class="action-btn" type="button" data-action="exportRhWorkflowJson"><i data-lucide="download" class="w-3.5 h-3.5"></i><span>导出</span></button>
        <button class="action-btn" type="button" data-action="openRhWorkflowImport"><i data-lucide="upload" class="w-3.5 h-3.5"></i><span>导入</span></button>
        <input id="rhWorkflowImportInput" type="file" accept="application/json,.json" hidden data-action="importRhWorkflowJson">
        <button id="rhWorkflowSaveBtn" class="action-btn save-btn" data-action="saveRhWorkflowEditor">保存</button>
        <button class="rh-workflow-editor-close" data-action="closeRhWorkflowEditor" aria-label="关闭">×</button>
      </div>
    </div>
    <div id="rhEditorNotice" class="rh-editor-notice" role="status" aria-live="polite" hidden></div>
    <div class="rh-workflow-editor-body">
      <aside class="rh-workflow-editor-side">
        <label class="rh-editor-field"><span>名称</span><input id="rhWorkflowEditName" data-action="updateRhWorkflowEditorMeta" data-action-arg="title" autocomplete="off"></label>
        <label class="rh-editor-field"><span>备注</span><textarea id="rhWorkflowEditNote" data-action="updateRhWorkflowEditorMeta" data-action-arg="description" placeholder="给团队的使用说明（可选）"></textarea></label>
        <div id="rhWorkflowEditorSummary" class="rh-editor-summary"></div>
        <div id="rhWorkflowEditorNodeList" class="rh-editor-node-list"></div>
      </aside>
      <section class="rh-workflow-editor-canvas"><div id="rhWorkflowEditorGraphWrap" class="rh-editor-graph-wrap rh-app-field-wrap"></div></section>
    </div>
  </div></div>
</body>
</html>
