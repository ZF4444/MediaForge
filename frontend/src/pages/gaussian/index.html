<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/logo.png" type="image/png">
    <title>Fine Angle | 视角微调</title>
    <link rel="stylesheet" href="../../styles/theme.css">
    <link rel="stylesheet" href="../../styles/fonts.css">
    <link rel="stylesheet" href="./page.css">
</head>

<body class="selection:bg-black selection:text-white">

    <div class="container-box">
        <header class="flex flex-col md:flex-row justify-between items-end mb-16 gap-6">
            <div class="space-y-1">
                <h1 class="text-4xl font-extrabold tracking-[-0.05em] flex items-center">
                    FINE ANGLE<span class="text-base mt-3 ml-1">®</span>
                </h1>
                <p class="text-[10px] font-bold uppercase tracking-[0.5em] text-gray-400">Fine Angle Adjustment</p>
            </div>
            <nav class="flex gap-8 text-[11px] font-bold uppercase tracking-widest text-gray-500">
                <span class="text-black border-b-2 border-black pb-1">Fine Angle</span>
            </nav>
        </header>

        <main class="space-y-12">
            <!-- Row 1: 输入图 + 高斯渲染查看器 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10 items-start">
                <section class="group w-full">
                    <h3 class="text-[9px] font-black uppercase tracking-[0.3em] mb-5 text-gray-400">01. <span>Input Source</span></h3>
                    <div id="dropzone"
                        class="upload-item relative overflow-hidden rounded-2xl aspect-[4/3] flex flex-col items-center justify-center cursor-pointer">
                        <input type="file" id="fileInput" class="hidden" accept="image/*">
                        <div id="uploadContent" class="text-center space-y-4">
                            <div class="w-14 h-14 rounded-full border border-gray-200 bg-white flex items-center justify-center mx-auto group-hover:bg-black group-hover:text-white group-hover:border-black transition-all duration-500">
                                <i data-lucide="arrow-up" class="w-5 h-5"></i>
                            </div>
                            <p class="text-[11px] font-bold uppercase tracking-tight">Drop image here</p>
                        </div>
                        <img id="previewImg" class="hidden absolute inset-0 w-full h-full object-cover">
                        <div id="changeOverlay"
                            class="hidden absolute inset-0 bg-black/10 backdrop-blur-sm items-center justify-center opacity-0 hover:opacity-100 transition-opacity">
                            <span class="bg-white px-5 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest shadow-2xl">Change</span>
                        </div>
                    </div>
                </section>

                <section class="space-y-6 w-full">
                    <h3 class="text-[9px] font-black uppercase tracking-[0.3em] text-gray-400">02. <span>Actions</span></h3>

                    <div class="w-full aspect-[4/3] bg-white rounded-2xl border border-gray-100 shadow-sm p-8 flex flex-col justify-center gap-6 overflow-y-auto">
                        <!-- 生成状态 -->
                        <div id="genState" class="text-center space-y-3 text-gray-400">
                            <i data-lucide="box" class="w-10 h-10 mx-auto stroke-[1px]"></i>
                            <p class="text-[10px] font-bold uppercase tracking-[0.3em]">上传参考图后，点击生成 3D 高斯模型</p>
                        </div>

                        <!-- 3D 高斯生成（上） -->
                        <button id="genGaussianBtn" data-gaussian-action="generate"
                            class="glass-btn w-full py-5 text-white rounded-xl font-bold text-[11px] uppercase tracking-[0.4em] flex items-center justify-center gap-3 shadow-xl shadow-black/10 disabled:opacity-50 disabled:cursor-not-allowed">
                            <i data-lucide="sparkles" class="w-4 h-4 text-yellow-400"></i>
                            <span id="genBtnText">3D 高斯生成</span>
                        </button>

                        <!-- 生成进度 -->
                        <div id="gen-progress-container" class="hidden w-full">
                            <div class="flex justify-between text-[9px] font-bold text-gray-400 mb-1 uppercase tracking-widest">
                                <span id="gen-status-text">Pending...</span>
                                <span id="gen-percent">0%</span>
                            </div>
                            <div class="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                                <div id="gen-progress-bar" class="bg-black h-full rounded-full transition-all duration-300 gaussian-progress-bar"></div>
                            </div>
                        </div>

                        <div class="flex items-center justify-center gap-2 text-[10px] font-bold uppercase tracking-widest text-gray-400">
                            <i data-lucide="cloud" class="w-3 h-3"></i>
                            <span>RunningHub</span>
                        </div>

                        <!-- 生成新视角（下） -->
                        <button id="genBtn" data-gaussian-action="repair" disabled
                            class="glass-btn w-full py-5 text-white rounded-xl font-bold text-[11px] uppercase tracking-[0.4em] flex items-center justify-center gap-3 shadow-xl shadow-black/10 disabled:opacity-50 disabled:cursor-not-allowed">
                            <i data-lucide="zap" id="btnIcon" class="w-4 h-4 text-yellow-400"></i>
                            <span id="btnText">生成新视角</span>
                        </button>
                    </div>
                </section>
            </div>

            <!-- Row 2: 查看器 + 结果预览 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10 items-stretch">
                <section class="flex flex-col space-y-6">
                    <h3 class="text-[9px] font-black uppercase tracking-[0.3em] text-gray-400">03. <span>Gaussian Viewer</span></h3>
                    <div class="flex-1 w-full aspect-[4/3] bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                        <iframe id="viewerFrame" src="/static/gaussian-viewer.html?embed=1" title="Gaussian Viewer"></iframe>
                    </div>
                </section>

                <section class="space-y-6 flex flex-col">
                    <h3 class="text-[9px] font-black uppercase tracking-[0.3em] text-gray-400">04. <span>Result Preview</span></h3>
                    <div id="resultBox"
                        class="result-frame relative aspect-[4/3] w-full flex items-center justify-center overflow-hidden group">
                        <div id="emptyState" class="text-center space-y-4 opacity-20">
                            <i data-lucide="camera" class="w-12 h-12 mx-auto stroke-[1px]"></i>
                            <p class="text-[10px] font-black tracking-[0.5em] uppercase">Canvas Ready</p>
                        </div>

                        <div id="loadingState" class="hidden flex flex-col items-center gap-5 w-full max-w-[80%]">
                            <div class="loading-box"></div>
                            <p class="text-[10px] font-bold uppercase tracking-[0.4em] animate-pulse">Processing...</p>
                            <div id="cloud-progress-container" class="hidden w-full mt-4">
                                <div class="flex justify-between text-[9px] font-bold text-gray-400 mb-1 uppercase tracking-widest">
                                    <span id="cloud-status-text">Pending...</span>
                                    <span id="cloud-percent">0%</span>
                                </div>
                                <div class="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                                    <div id="cloud-progress-bar" class="bg-black h-full rounded-full transition-all duration-300 gaussian-progress-bar"></div>
                                </div>
                            </div>
                        </div>

                        <img id="outputImg"
                            class="hidden w-full h-full object-contain p-8 cursor-zoom-in transition-all duration-700 hover:scale-[1.02]"
                            data-gaussian-action="zoom-image">

                        <a id="downloadBtn" href="#" download
                            class="hidden absolute bottom-8 right-8 w-14 h-14 bg-white shadow-2xl rounded-2xl flex items-center justify-center hover:bg-black hover:text-white transition-all duration-500 border border-gray-100">
                            <i data-lucide="download" class="w-5 h-5"></i>
                        </a>
                    </div>
                </section>
            </div>
        </main>

        <section class="mt-32">
            <div class="flex items-center gap-6 mb-10">
                <h2 class="text-[11px] font-black uppercase tracking-[0.5em]">Archive</h2>
                <div class="h-px flex-1 bg-black/5"></div>
            </div>
            <div id="masonry" class="masonry-grid"></div>
            <div id="loadMoreTrigger" class="py-16 text-center opacity-20 text-[10px] font-bold uppercase tracking-widest">
                End of Archive
            </div>
        </section>
    </div>

    <div id="lightbox" data-gaussian-action="outside-click"
        class="hidden fixed inset-0 z-50 bg-white/95 backdrop-blur-3xl flex items-center justify-center p-8">
        <button data-gaussian-action="close-lightbox" class="absolute top-10 right-10 p-2 hover:rotate-90 transition-transform duration-500">
            <i data-lucide="x" class="w-8 h-8"></i>
        </button>
        <div class="w-full h-full flex flex-col items-center justify-center gaussian-lightbox-content">
            <div id="lightboxFrame" class="studio-preview-frame hidden">
                <img id="lightboxImg" src="" class="studio-preview-img" alt="preview">
                <div id="lightboxRes" data-no-pan
                    class="absolute top-4 left-4 bg-black/30 backdrop-blur-md border border-white/20 text-white px-3 py-1.5 rounded-full text-[10px] font-medium tracking-wider opacity-0 transition-opacity duration-300 pointer-events-none z-10">
                </div>
            </div>
            <div class="mt-8">
                <button data-gaussian-action="download-lightbox"
                    class="px-10 py-4 bg-black text-white rounded-full text-[10px] font-black uppercase tracking-widest flex items-center gap-3 shadow-xl">
                    <i data-lucide="save" class="w-4 h-4"></i> Save Master
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="../../gaussian/main.js"></script>
</body>

</html>
