<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <link rel="stylesheet" href="/static/dist/styles/theme.css">
    <link rel="stylesheet" href="./page.css">
</head>
<body>
<div class="shell">
    <header class="head">
        <div class="title-row"><div class="title">用户管理</div><div id="userCount" class="count"></div></div>
        <nav class="tabs" aria-label="用户管理视图">
            <button class="tab active" data-tab="users"><i data-lucide="users"></i>用户列表</button>
            <button class="tab" data-tab="access"><i data-lucide="shield-check"></i>权限管理</button>
            <button class="tab" data-tab="quota"><i data-lucide="database"></i>存储配额</button>
            <button class="tab" data-tab="sessions"><i data-lucide="monitor-smartphone"></i>登录会话</button>
            <button class="tab" data-tab="usage"><i data-lucide="chart-no-axes-column"></i>使用统计</button>
            <button class="tab" data-tab="budgets"><i data-lucide="wallet-cards"></i>预算配置</button>
        </nav>
    </header>
    <main class="content">
        <section class="view active" data-view="users">
            <div class="users">
                <div class="org-panel">
                    <div class="org-panel-head">
                        <div class="org-panel-title">组织</div>
                        <div id="orgStatus" class="status"></div>
                    </div>
                    <form id="orgForm" class="org-form">
                        <input id="orgNameInput" class="org-input" type="text" placeholder="新建组织名称" maxlength="60">
                        <button type="submit" class="org-btn"><i data-lucide="plus"></i>创建组织</button>
                    </form>
                    <div id="orgList" class="org-list org-list-spaced"></div>
                </div>
                <div class="toolbar"><div><div class="section-title">注册用户</div><div id="status" class="status">加载中...</div></div><input id="search" class="search" type="search" placeholder="搜索用户名或用户 ID"></div>
                <div id="userTable" class="table"></div>
            </div>
        </section>
        <section class="view" data-view="access"><iframe class="embed" data-src="/static/access-control.html" title="权限管理"></iframe></section>
        <section class="view" data-view="quota"><iframe class="embed" data-src="/static/storage-quota.html" title="存储配额"></iframe></section>
        <section class="view" data-view="sessions"><div class="sessions"><div class="session-toolbar"><div><h2>登录会话</h2><p id="sessionStatus">查看当前在线用户和最近活动时间</p></div><div class="session-actions"><label class="session-filter"><input id="onlineOnly" type="checkbox"> 仅在线</label><button id="refreshSessions" class="session-refresh" type="button" title="刷新会话"><i data-lucide="refresh-cw"></i></button></div></div><div id="sessionTable" class="session-table"></div></div></section>
        <section class="view" data-view="usage"><div class="usage"><div class="usage-toolbar"><div><h2>使用统计</h2><p id="usageStatus">所有费用按 USD 结算</p></div><div class="usage-toolbar-actions"><button id="syncOmnilojo" class="budget-save" type="button" title="刷新用量"><i data-lucide="refresh-cw"></i></button><input id="usageMonth" class="month-input" type="month"></div></div><div id="usageSummary"></div><div class="usage-summary-title">使用明细</div><div id="usageTable" class="usage-table"></div></div></section>
        <section class="view" data-view="budgets"><div class="usage"><div class="usage-toolbar"><div><h2>预算配置</h2><p id="budgetStatus">所有预算按 USD 设置</p></div></div><div class="budget-row default-budget-row"><div class="budget-head"><span class="budget-name">新用户默认预算</span><span class="budget-state">仅影响之后新建的用户</span></div><div class="budget-meta default-budget-meta">新用户首次创建时自动写入个人月度预算。</div><div class="budget-edit"><input id="newUserBudgetInput" type="number" min="0" step="0.0001" placeholder="月度预算（USD）"><label class="budget-toggle"><input id="newUserBudgetEnabled" type="checkbox">启用</label><button id="newUserBudgetSave" class="budget-save" type="button" title="保存新用户默认预算"><i data-lucide="check"></i></button></div></div><div class="section-title budget-section-title">组织预算</div><div id="budgetGrid" class="usage-grid"></div><div class="section-title budget-section-title personal-budget-title">个人预算</div><div id="personalBudgetGrid" class="usage-grid"></div></div></section>
</main>
</div>
<script type="module" src="../../user-management/main.js"></script>
</body>
</html>
