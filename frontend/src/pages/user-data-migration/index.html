<!doctype html>
<html lang="zh-CN">
<head>
<script type="module" blocking="render" src="/static/dist/shared/theme-bootstrap-early.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>用户数据迁移</title>
<link rel="stylesheet" href="/static/dist/styles/theme.css"><link rel="stylesheet" href="/static/dist/styles/macos-dark.css">

<body><main class="panel"><h1>用户数据迁移</h1><p class="intro">将待迁移账号的业务数据迁移到当前飞书账号，完成后删除待迁移账号。预算、组织、访问权限和存储配额等管理配置不会迁移。</p><div class="form"><input id="username" placeholder="输入待迁移账号的用户名"><button id="lookup" class="button primary" type="button">查询账号</button></div><div id="status" class="status" role="status"></div><div id="list"></div><div id="confirm" class="confirm" hidden><label><input id="check" type="checkbox">我已确认这是要迁移的账号</label><br><button id="execute" class="button danger" type="button" disabled>确认迁移并删除原账号</button></div><p class="help">迁移是不可逆操作。请在确认前核对账号和画布列表。</p></main>
<script type="module" src="../../user-data-migration/main.js"></script></body></html>
