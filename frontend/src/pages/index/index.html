<!DOCTYPE html>
<html lang="zh-CN" class="studio-route-booting">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/logo.png" type="image/png">
    <title>AI Studio</title>

    <link rel="stylesheet" href="/src/styles/fonts.css">
    <link rel="stylesheet" href="/src/styles/theme.css">
    <link rel="stylesheet" href="/src/styles/markdown-content.css">
    <link rel="stylesheet" href="/src/pages/index/index.css">
</head>

<body>

    <div class="app-shell">
        <aside class="sidebar" id="studioSidebar">
            <div class="sidebar-toggle-hitbox" data-studio-action="toggle-sidebar">
                <button class="logo-ring" id="sidebarLogoToggle" type="button" aria-pressed="false" aria-label="展开导航栏" title="展开导航栏">
                    <svg id="sidebar-open-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v18"></path><path d="m14 9 3 3-3 3"></path></svg>
                    <svg id="sidebar-collapse-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3v18"></path><path d="m10 9-3 3 3 3"></path></svg>
                    <span class="sidebar-toggle-label">收起导航栏</span>
                </button>
            </div>

            <nav>
                <div class="nav-item active" data-page-id="canvas">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span class="nav-text" data-i18n="nav.canvas">无限画布</span>
                </div>
                <div class="nav-item" data-page-id="gpt-chat">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span class="nav-text" data-i18n="nav.gpt">GPT 对话</span>
                </div>
                <div class="nav-item" data-page-id="asset-manager">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5V6.8A2.8 2.8 0 0 1 6.8 4h10.4A2.8 2.8 0 0 1 20 6.8v12.7"></path>
                        <path d="M7 8h10"></path>
                        <path d="M7 12h10"></path>
                        <path d="M7 16h6"></path>
                    </svg>
                    <span class="nav-text" data-i18n="nav.assetManager">素材库</span>
                </div>

                <!-- 分隔线 -->
                <div class="nav-divider"></div>

                <button class="nav-fold-toggle" id="local-nav-toggle" type="button" data-studio-action="toggle-local-nav" aria-expanded="true" title="折叠定制功能">
                    <svg class="nav-fold-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                    <span class="nav-text" data-i18n="nav.localTools">定制功能</span>
                </button>

                <div class="nav-fold-group" id="local-nav-group">
                    <div class="nav-item" data-page-id="user-data-migration">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
                        <span class="nav-text">用户数据迁移</span>
                    </div>
                    <div class="nav-item" data-page-id="angle">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line x1="12" y1="22.08" x2="12" y2="12"></line>
                        </svg>
                        <span class="nav-text" data-i18n="nav.angle">视角粗调</span>
                    </div>
                    <div class="nav-item" data-page-id="gaussian">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <circle cx="6" cy="7" r="1.5"></circle>
                            <circle cx="18" cy="8" r="2"></circle>
                            <circle cx="7" cy="17" r="2"></circle>
                            <circle cx="17" cy="16" r="1.5"></circle>
                        </svg>
                        <span class="nav-text" data-i18n="nav.gaussian">视角微调</span>
                    </div>
                    <div class="nav-item" data-page-id="pose-studio">
                        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="4.5" r="2"></circle>
                            <path d="M12 6.5v5"></path>
                            <path d="M8.5 10.5 12 8l3.5 2.5"></path>
                            <path d="M12 11.5 8.5 18"></path>
                            <path d="M12 11.5 15.5 18"></path>
                            <path d="M7 18h3"></path>
                            <path d="M14 18h3"></path>
                        </svg>
                        <span class="nav-text" data-i18n="nav.poseStudio">姿势编辑</span>
                    </div>
                </div>
            </nav>

            <div class="side-actions">
                <button class="side-pill" data-studio-action="toggle-theme" id="theme-toggle-btn" type="button" title="切换夜间模式">
                    <svg id="icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg id="icon-sun" class="is-hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <span class="side-pill-text" data-i18n="common.darkMode">黑夜模式</span>
                </button>
                <button class="side-pill" data-studio-action="open-guide" data-href="https://d98s7r3gmd.feishu.cn/wiki/NBPtwUv3EiGN1XkZeFicUaltnWg?from=from_copylink" type="button" title="使用说明">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    <span class="side-pill-text" data-i18n="common.userGuide">使用说明</span>
                </button>
                <button id="nav-api-settings" class="side-pill" data-page-id="api-settings" type="button" title="API 设置">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 7h3a5 5 0 0 1 0 10h-3"></path>
                        <path d="M9 17H6A5 5 0 0 1 6 7h3"></path>
                        <line x1="8" y1="12" x2="16" y2="12"></line>
                    </svg>
                    <span class="side-pill-text" data-i18n="common.apiSettings">API 设置</span>
                </button>
                <button class="side-pill" data-page-id="comfyui-settings" type="button" title="工作流设置">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                        <path d="M14 14h7v7h-7z"></path>
                        <line x1="10" y1="6.5" x2="14" y2="6.5"></line>
                        <line x1="6.5" y1="10" x2="6.5" y2="14"></line>
                    </svg>
                    <span class="side-pill-text" data-i18n="common.comfyuiSettings">工作流设置</span>
                </button>
                <button class="side-pill is-hidden" id="nav-user-management" data-page-id="user-management" type="button" title="用户管理">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <span class="side-pill-text">用户管理</span>
                </button>
                <button class="side-pill is-hidden" id="nav-feedback-admin" data-page-id="feedback-admin" type="button" title="反馈管理">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        <path d="M8 9h8"></path>
                        <path d="M8 13h5"></path>
                    </svg>
                    <span class="side-pill-text">反馈管理</span>
                </button>
                <button class="side-pill is-hidden" id="nav-broadcast-admin" data-page-id="broadcast-admin" type="button" title="全局广播">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"></path>
                        <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.4"></path>
                        <circle cx="12" cy="12" r="2"></circle>
                        <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.4"></path>
                        <path d="M19.1 4.9c3.9 3.9 3.9 10.2 0 14.2"></path>
                    </svg>
                    <span class="side-pill-text">全局广播</span>
                </button>
                <button class="side-pill" id="nav-storage-manager" data-page-id="storage-manager" type="button" title="空间管理">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12c0 1.1-4 2-9 2s-9-.9-9-2"></path>
                        <path d="M3 6v12c0 1.1 4 2 9 2s9-.9 9-2V6"></path>
                        <ellipse cx="12" cy="6" rx="9" ry="2"></ellipse>
                    </svg>
                    <span class="side-pill-text">空间管理</span>
                </button>
                <button class="side-pill" id="nav-my-account" data-page-id="my-account" type="button" title="我的账户">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 21a8 8 0 0 1 16 0"></path>
                    </svg>
                    <span class="side-pill-text">我的账户</span>
                </button>
            </div>
        </aside>


        <main class="stage">
            <iframe id="frame-angle" data-src="/static/angle.html" scrolling="yes"></iframe>
            <iframe id="frame-gaussian" data-src="/static/gaussian.html" scrolling="yes"></iframe>
            <iframe id="frame-pose-studio" data-src="/static/pose-studio.html" scrolling="yes"></iframe>
                <iframe id="frame-gpt-chat" data-src="/static/gpt-chat.html" scrolling="yes"></iframe>
            <iframe id="frame-canvas" data-src="/static/canvas-manager.html" class="active" scrolling="yes"></iframe>
            <iframe id="frame-asset-manager" data-src="/static/asset-manager.html" scrolling="yes"></iframe>
            <iframe id="frame-storage-manager" data-src="/static/storage-manager.html?tab=storage" scrolling="yes"></iframe>
            <iframe id="frame-my-account" data-src="/static/my-account.html" scrolling="yes"></iframe>
            <iframe id="frame-api-settings" data-src="/static/ai-connections.html" scrolling="yes"></iframe>
            <iframe id="frame-comfyui-settings" data-src="/static/workflow-settings.html" scrolling="yes"></iframe>
            <iframe id="frame-user-management" data-src="/static/user-management.html" scrolling="yes"></iframe>
            <iframe id="frame-user-data-migration" data-src="/static/user-data-migration.html" scrolling="yes"></iframe>
            <iframe id="frame-feedback-admin" data-src="/static/feedback-admin.html" scrolling="yes"></iframe>
            <iframe id="frame-broadcast-admin" data-src="/static/broadcast-admin.html" scrolling="yes"></iframe>

        </main>
    </div>

    <button class="floating-action help-float" id="helpOpenBtn" type="button" title="查看说明">说明</button>
    <button class="floating-action feedback-float" id="feedbackOpenBtn" type="button" title="提交反馈">反馈</button>
    <a class="floating-action contact-float" id="contactAdminBtn" href="https://applink.feishu.cn/client/chat/open?openId=ou_a7412f70153a57bf5e696197a35fdf1c" target="_blank" rel="noopener noreferrer" title="联系管理员">联系管理员</a>
    <aside class="help-drawer" id="helpDrawer" aria-hidden="true">
        <div class="help-resize-handle" id="helpResizeHandle" role="separator" aria-orientation="vertical" tabindex="0" title="调整宽度"></div>
        <div class="help-head">
            <div class="help-title">说明<span class="help-title-page" id="helpTitlePage"></span></div>
            <div class="help-head-actions">
                <button class="help-mini-btn is-hidden" id="helpPreviewBtn" type="button">预览</button>
                <button class="help-mini-btn is-hidden" id="helpEditBtn" type="button">编辑</button>
                <button class="help-save is-hidden" id="helpSaveBtn" type="button">保存</button>
                <button class="help-close" id="helpCloseBtn" type="button" aria-label="关闭">×</button>
            </div>
        </div>
        <div class="help-body">
            <div class="help-markdown" id="helpPreview"></div>
            <textarea class="help-editor is-hidden" id="helpEditor" maxlength="100000"></textarea>
        </div>
        <div class="help-status" id="helpStatus"></div>
    </aside>
    <div class="feedback-overlay" id="feedbackOverlay" aria-hidden="true">
        <div class="feedback-modal" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
            <div class="feedback-head">
                <div class="feedback-title" id="feedbackTitle">提交反馈</div>
                <button class="feedback-close" id="feedbackCloseBtn" type="button" aria-label="关闭">×</button>
            </div>
            <div class="feedback-field">
                <label class="feedback-label" for="feedbackType">类型</label>
                <select class="feedback-select" id="feedbackType">
                    <option value="issue">问题反馈</option>
                    <option value="idea">功能建议</option>
                    <option value="question">使用疑问</option>
                    <option value="other">其他</option>
                </select>
            </div>
            <div class="feedback-field">
                <label class="feedback-label" for="feedbackContent">内容</label>
                <textarea class="feedback-textarea" id="feedbackContent" maxlength="2000" placeholder="请描述你遇到的问题或建议。"></textarea>
            </div>
            <div class="feedback-footer">
                <div class="feedback-status" id="feedbackStatus"></div>
                <button class="feedback-submit" id="feedbackSubmitBtn" type="button">发送</button>
            </div>
        </div>
    </div>

    <!-- 版本更新检测 -->
    <!-- 热更新提示（仅 c 段变化）：非强制，可手动关闭。 -->
    <div id="versionToast" class="version-toast">
        <span>检测到新版本，建议刷新页面以获取最新功能</span>
        <button data-studio-action="reload">刷新</button>
        <button data-studio-action="dismiss-version">✕</button>
    </div>
    <!-- 不兼容更新强制弹窗（a/b 段变化）：毛玻璃背景，仅有更新按钮，无法手动关闭。 -->
    <div id="versionForceOverlay" class="version-force-overlay">
        <div class="version-force-card">
            <div class="version-force-icon">🚀</div>
            <div class="version-force-title">检测到重大版本更新</div>
            <div class="version-force-copy">当前版本已与最新版本不兼容，请立即刷新页面以继续使用，避免出现异常。</div>
            <button data-studio-action="reload" class="version-force-reload">立即更新</button>
        </div>
    </div>

    <script type="module" src="/src/index/main.js"></script>
</body>

</html>
