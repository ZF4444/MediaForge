<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>素材库管理</title>
  <script type="module" blocking="render" src="/static/dist/shared/theme-bootstrap-early.js"></script>
  <link rel="stylesheet" href="/static/dist/styles/theme.css">
  <link rel="stylesheet" href="/static/dist/styles/asset-manager.css">
  <link rel="stylesheet" href="/static/dist/styles/workspace-theme.css">
</head>
<body>
  <div class="asset-page">
    <header class="asset-page-head"><div><div class="asset-title">素材库管理</div><div class="asset-sub">按库、分组、内容和预览管理素材与提示词。</div></div><div class="asset-head-actions"><div id="assetStatus" class="asset-status">准备就绪</div><button id="refreshBtn" class="asset-btn" type="button"><i data-lucide="refresh-cw"></i><span>刷新</span></button></div></header>
    <div class="asset-tabs"><button id="assetTabAssets" class="active" type="button" data-tab="assets"><i data-lucide="image"></i><span>图片资产</span></button><button id="assetTabPrompts" type="button" data-tab="prompts"><i data-lucide="text-cursor-input"></i><span>提示词库</span></button><button id="assetTabCanvasAssets" type="button" data-tab="canvas-assets"><i data-lucide="layout-dashboard"></i><span>画布资产</span></button><button id="assetTabLocal" type="button" data-tab="local"><i data-lucide="folder-open"></i><span>本地素材</span></button></div>
    <main id="assetManagerRoot" class="asset-manager-root"></main>
  </div>
  <input id="assetUploadInput" type="file" accept="image/*,video/*,audio/*" multiple hidden>
  <script type="module" src="../../asset-manager/page-runtime.js"></script>
</body>
</html>
