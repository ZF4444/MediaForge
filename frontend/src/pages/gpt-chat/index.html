<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/logo.png" type="image/png">
    <title>GPT 对话</title>
  <script type="module" blocking="render" src="/static/dist/shared/theme-bootstrap-early.js"></script>
    <!-- Icons are bundled with the page's ESM entry; no global vendor runtime is required. -->
    <link rel="stylesheet" href="/static/dist/styles/theme.css">
    <link rel="stylesheet" href="/static/dist/styles/fonts.css">
    <link rel="stylesheet" href="/static/dist/styles/gpt-chat.css">
</head>
<body>
    <div class="chat-shell">
        <main class="chat-main">
            <header class="topbar">
                <div class="topbar-inner">
                    <div class="title-block">
                        <h1 id="chatTitle" data-i18n="chat.newConversation">新对话</h1>
                    </div>
                    <div class="top-actions">
                        <button data-action="new-conversation" class="action-btn" title="新建对话" data-i18n-title="chat.newConversation"><i data-lucide="plus"></i><span data-i18n="chat.new">新建</span></button>
                        <button data-action="toggle-system-prompt" class="action-btn" title="系统提示词"><i data-lucide="sliders-horizontal"></i><span>系统</span></button>
                        <aside id="systemPromptPopover" class="system-prompt-popover">
                            <div class="system-prompt-head">
                                <div class="system-prompt-title">系统提示词</div>
                                <button data-action="close-system-prompt" class="rail-close" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
                            </div>
                            <textarea id="systemPromptInput" class="system-prompt-textarea" placeholder="例如：你是一个专业图片创作助手，回答要简洁，并优先给出可执行步骤。"></textarea>
                            <div class="system-prompt-actions">
                                <button type="button" data-action="clear-system-prompt">清空</button>
                                <button type="button" class="primary" data-action="save-system-prompt">保存</button>
                            </div>
                        </aside>
                        <button data-action="toggle-history" class="action-btn history-toggle" title="历史对话" data-i18n-title="chat.history"><i data-lucide="clock-3"></i><span data-i18n="chat.history">历史</span></button>
                        <aside id="historyPopover" class="chat-rail">
                            <div class="rail-head">
                                <div>
                                    <div class="rail-kicker" data-i18n="chat.historyTitle">Conversations</div>
                                    <div class="rail-title" data-i18n="chat.history">历史</div>
                                </div>
                                <button data-action="close-history" class="rail-close" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
                            </div>
                            <button data-action="new-conversation" class="rail-new" title="新建对话" data-i18n-title="chat.newConversation"><i data-lucide="plus"></i><span data-i18n="chat.new">新建</span></button>
                            <div id="threadList" class="thread-list"></div>
                        </aside>
                    </div>
                </div>
            </header>

            <section id="messages" class="messages"></section>

            <div class="composer-wrap">
                <div class="composer">
                    <div id="composerBody" class="composer-body">
                        <textarea id="messageInput" rows="4" placeholder="输入消息，Enter 发送..." data-i18n-placeholder="chat.inputPlaceholder"></textarea>
                        <div id="refStrip" class="ref-strip"></div>
                        <div class="composer-inside-foot">
                            <div class="left-tools">
                                <div class="inline-controls">
                                    <input id="attachmentInput" class="file-input" type="file" multiple>
                                    <button type="button" data-action="upload-files" class="upload-btn" title="上传附件" aria-label="上传附件">
                                        <i data-lucide="paperclip"></i>
                                    </button>
                                    <div id="modelPicker" class="model-picker">
                                        <button id="modelPickerBtn" data-action="toggle-model-picker" class="model-picker-button" title="选择平台和模型">
                                            <i data-lucide="boxes"></i>
                                            <span class="model-picker-labels">
                                                <span id="modelPickerProvider" class="model-picker-provider">API</span>
                                                <span class="model-picker-dot"></span>
                                                <span id="modelPickerModel" class="model-picker-model">Model</span>
                                            </span>
                                            <i data-lucide="chevron-up"></i>
                                        </button>
                                        <div id="modelPickerPopover" class="model-picker-popover">
                                            <div class="model-picker-head">
                                                <div id="modelPickerTitle" class="model-picker-title">模型选择</div>
                                                <div id="modelPickerScope" class="model-picker-scope"></div>
                                            </div>
                                            <div class="model-picker-body">
                                                <div id="modelConnectionList" class="model-picker-list"></div>
                                                <div id="modelList" class="model-picker-list"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div id="imageControls" class="image-controls hidden">
                                        <div id="resolutionPicker" class="resolution-picker" title="比例和分辨率">
                                            <button id="resolutionPickerBtn" data-action="toggle-resolution-picker" class="resolution-picker-button" title="比例和分辨率">
                                                <i data-lucide="ruler"></i>
                                                <span class="resolution-picker-labels">
                                                    <span id="resolutionPickerType" class="resolution-picker-type">尺寸</span>
                                                    <span class="resolution-picker-dot"></span>
                                                    <span id="resolutionPickerValue" class="resolution-picker-value">自动</span>
                                                </span>
                                                <i data-lucide="chevron-up"></i>
                                            </button>
                                            <div id="resolutionPickerPopover" class="resolution-picker-popover">
                                                <div class="resolution-picker-head">
                                                    <div class="resolution-picker-title">尺寸选择</div>
                                                    <div id="resolutionPickerScope" class="resolution-picker-scope">
                                                        <button id="resolutionScopeAuto" type="button" class="active" data-resolution-scope="auto">自动</button>
                                                        <button id="resolutionScopePreset" type="button" data-resolution-scope="preset">内置尺寸</button>
                                                        <button id="resolutionScopeCustom" type="button" data-resolution-scope="custom">自定义</button>
                                                    </div>
                                                </div>
                                                <div id="resolutionAutoPane" class="resolution-picker-pane custom">
                                                    <div class="resolution-custom-box">
                                                        <div class="resolution-custom-title">自动尺寸</div>
                                                        <div class="resolution-custom-hint">默认 1024x1024；提示词包含比例或明确尺寸时自动匹配。</div>
                                                    </div>
                                                </div>
                                                <div id="resolutionPresetPane" class="resolution-picker-pane preset hidden">
                                                    <div id="resolutionRatioList" class="resolution-picker-list">
                                                        <button id="chat-ratio-square" type="button" class="resolution-picker-option active" data-chat-ratio="square"><span>1:1</span><small>正方形</small></button>
                                                        <button id="chat-ratio-portrait" type="button" class="resolution-picker-option" data-chat-ratio="portrait"><span>2:3</span><small>竖图</small></button>
                                                        <button id="chat-ratio-landscape" type="button" class="resolution-picker-option" data-chat-ratio="landscape"><span>3:2</span><small>横图</small></button>
                                                        <button id="chat-ratio-portrait43" type="button" class="resolution-picker-option" data-chat-ratio="portrait43"><span>3:4</span><small>竖图</small></button>
                                                        <button id="chat-ratio-landscape43" type="button" class="resolution-picker-option" data-chat-ratio="landscape43"><span>4:3</span><small>横图</small></button>
                                                        <button id="chat-ratio-story" type="button" class="resolution-picker-option" data-chat-ratio="story"><span>9:16</span><small>竖屏</small></button>
                                                        <button id="chat-ratio-wide" type="button" class="resolution-picker-option" data-chat-ratio="wide"><span>16:9</span><small>宽屏</small></button>
                                                    </div>
                                                    <div id="resolutionLevelList" class="resolution-picker-list">
                                                        <button type="button" class="resolution-picker-option" data-resolution="1k"><span>1K</span><small id="resolutionPreset1k">1024x1024</small></button>
                                                        <button type="button" class="resolution-picker-option" data-resolution="2k"><span>2K</span><small id="resolutionPreset2k">1536x1536</small></button>
                                                        <button type="button" class="resolution-picker-option" data-resolution="4k"><span>4K</span><small id="resolutionPreset4k">2048x2048</small></button>
                                                    </div>
                                                </div>
                                                <div id="resolutionCustomPane" class="resolution-picker-pane custom hidden">
                                                    <div class="resolution-custom-box">
                                                        <div class="resolution-custom-title">自定义分辨率</div>
                                                        <div class="resolution-custom-row">
                                                            <input id="customResolutionWidth" type="number" min="256" max="8192" step="1" placeholder="宽">
                                                            <span>x</span>
                                                            <input id="customResolutionHeight" type="number" min="256" max="8192" step="1" placeholder="高">
                                                            <button type="button" data-action="apply-custom-resolution">应用</button>
                                                        </div>
                                                        <div id="customResolutionHint" class="resolution-custom-hint">输入 256-8192 之间的宽度和高度</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <button id="sendBtn" class="send-btn" title="发送" data-i18n-title="chat.send"><i data-lucide="send"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="imagePreviewModal" class="image-preview-modal">
        <button class="image-preview-close" data-action="close-image-preview" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
        <img id="imagePreviewImg" src="" alt="preview">
    </div>

    <script type="module" src="../../gpt-chat/main.js"></script>
</body>
</html>
