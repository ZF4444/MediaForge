[project]
name = "aistudio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.13.0",
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    "requests>=2.33.1",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.28",
    "httpx>=0.28.1",
    "pillow>=12.2.0",
    "minio>=7.2.18",
    "psycopg[binary]>=3.2.12",
    "psycopg-pool>=3.2.6",
    "prometheus-client>=0.22.1",
    "redis[hiredis]>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
