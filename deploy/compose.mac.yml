name: mediaforge-local

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mediaforge:local
    restart: unless-stopped
    env_file: .env
    environment:
      CANVAS_TASK_WORKER_ENABLED: "false"
      CANVAS_TASK_RECOVERY_ENABLED: "false"
      DATABASE_POOL_MIN_SIZE: "2"
      DATABASE_POOL_MAX_SIZE: "8"
      STORAGE_CACHE_DIR: /app/data/cache
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - mediaforge-app-data:/app/data
      - mediaforge-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  worker:
    image: mediaforge:local
    restart: unless-stopped
    env_file: .env
    environment:
      CANVAS_TASK_WORKER_ENABLED: "true"
      CANVAS_TASK_RECOVERY_ENABLED: "true"
      DATABASE_POOL_MIN_SIZE: "1"
      DATABASE_POOL_MAX_SIZE: "5"
    command: ["python", "-m", "app.workers.canvas"]
    volumes:
      - mediaforge-app-data:/app/data
      - mediaforge-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    volumes:
      - mediaforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - mediaforge-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: ${TZ}
    ports:
      - "127.0.0.1:19001:9001"
    volumes:
      - mediaforge-minio-data:/data

volumes:
  mediaforge-app-data:
  mediaforge-logs:
  mediaforge-postgres-data:
  mediaforge-redis-data:
  mediaforge-minio-data:
