# Requires Docker Compose >= 2.24.4 (!override support).
name: mediaforge-dev

services:
  api:
    extends:
      file: ../deploy/compose.yml
      service: api
    env_file: !override [.env]
    environment:
      PYTEST_ADDOPTS: "-o cache_dir=/app/data/pytest-cache"
    build:
      context: ../..
      dockerfile: Dockerfile
      target: development
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    volumes: !override
      - ../..:/app
      - ../../app:/watch/app:ro
      - ../../main.py:/watch/main.py:ro
      - app-data:/app/data
      - app-logs:/app/logs
      - app-workflows:/app/workflows
      - frontend-static:/app/static/dist
    ports: !override
      - "${DEV_HTTP_BIND:-127.0.0.1}:${DEV_HTTP_PORT:-3000}:3000"
    command: [uvicorn, 'main:app', --host, 0.0.0.0, --port, '3000', --reload, --reload-dir, /watch]
    depends_on:
      frontend:
        condition: service_completed_successfully

  worker:
    extends:
      file: ../deploy/compose.yml
      service: worker
    env_file: !override [.env]
    environment:
      PYTEST_ADDOPTS: "-o cache_dir=/app/data/pytest-cache"
    build:
      context: ../..
      dockerfile: Dockerfile
      target: development
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    volumes: !override
      - ../..:/app
      - app-data:/app/data
      - app-logs:/app/logs
      - app-workflows:/app/workflows
      - frontend-static:/app/static/dist
    depends_on:
      frontend:
        condition: service_completed_successfully

  frontend:
    image: ${FRONTEND_IMAGE:-node:22-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee}
    working_dir: /app/frontend
    volumes:
      - ../..:/app
      - frontend-modules:/app/frontend/node_modules
      - frontend-static:/app/static/dist
    command: [sh, -ec, 'npm ci && npm run build']
    restart: 'no'

  postgres:
    extends:
      file: ../deploy/compose.yml
      service: postgres
    ports:
      - "127.0.0.1:15432:5432"
    volumes: !override
      - postgres-data:/var/lib/postgresql/data

  redis:
    extends:
      file: ../deploy/compose.yml
      service: redis
    ports:
      - "127.0.0.1:16379:6379"
    volumes: !override
      - redis-data:/data

  minio:
    extends:
      file: ../deploy/compose.yml
      service: minio
    build:
      context: ../deploy
      dockerfile: minio.Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    volumes: !override
      - minio-data:/data

volumes:
  app-data:
  app-logs:
  app-workflows:
  frontend-static:
  frontend-modules:
  postgres-data:
  redis-data:
  minio-data:
