services:
  api:
    extends:
      file: ../deploy/compose.yml
      service: api
    env_file: !override []
    environment:
      <<: *business-environment
      LOAD_BOOTSTRAP_ENV: "false"
      PYTEST_ADDOPTS: "-o cache_dir=/app/data/pytest-cache"
    build:
      context: ../..
      dockerfile: Dockerfile
      target: development
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    volumes: !override
      - ../..:/app
      - ../../app:/watch/app:ro
      - ../../main.py:/watch/main.py:ro
      - app-data:/app/data
      - app-logs:/app/logs
      - app-workflows:/app/workflows
      - frontend-static:/app/static/dist
    ports: !override
      - "${DEV_HTTP_BIND:-127.0.0.1}:${DEV_HTTP_PORT:-3000}:3000"
    command: [uvicorn, 'main:app', --host, 0.0.0.0, --port, '3000', --reload, --reload-dir, /watch]
    depends_on:
      frontend:
        condition: service_completed_successfully

  worker:
    extends:
      file: ../deploy/compose.yml
      service: worker
    env_file: !override []
    environment:
      <<: *business-environment
      LOAD_BOOTSTRAP_ENV: "false"
      PYTEST_ADDOPTS: "-o cache_dir=/app/data/pytest-cache"
    build:
      context: ../..
      dockerfile: Dockerfile
      target: development
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    volumes: !override
      - ../..:/app
      - app-data:/app/data
      - app-logs:/app/logs
      - app-workflows:/app/workflows
      - frontend-static:/app/static/dist
    depends_on:
      frontend:
        condition: service_completed_successfully

  frontend:
    image: ${FRONTEND_IMAGE:-node:22-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee}
    working_dir: /app/frontend
    volumes:
      - ../..:/app
      - frontend-modules:/app/frontend/node_modules
      - frontend-static:/app/static/dist
    command: [sh, -ec, 'npm ci && npm run build']
    restart: 'no'

  project-init:
    profiles: [init]
    image: ${APP_IMAGE:?set APP_IMAGE}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: development
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
    environment:
      LOG_DIR: /app/logs/init
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: 'false'
      APP_SECRET_KEY:
      MINIO_BUCKET_PRIVATE:
      MINIO_BUCKET_PUBLIC:
      MINIO_BUCKET_TEMP:
    volumes:
      - ../..:/app:ro
      - app-data:/app/data
      - app-logs:/app/logs
    command: [python, -m, app.initialize]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    restart: 'no'

  postgres:
    extends:
      file: ../deploy/compose.yml
      service: postgres
    ports:
      - "127.0.0.1:15432:5432"
    volumes: !override
      - postgres-data:/var/lib/postgresql/data

  redis:
    extends:
      file: ../deploy/compose.yml
      service: redis
    ports:
      - "127.0.0.1:16379:6379"
    volumes: !override
      - redis-data:/data

  minio:
    extends:
      file: ../deploy/compose.yml
      service: minio
    build:
      context: ../deploy
      dockerfile: minio.Dockerfile
      args:
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    volumes: !override
      - minio-data:/data

volumes:
  app-data:
  app-logs:
  app-workflows:
  frontend-static:
  frontend-modules:
  postgres-data:
  redis-data:
  minio-data:
