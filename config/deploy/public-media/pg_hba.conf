# Standard single-host production deployment; PostgreSQL has no published port.
# Media roles must not bypass database restrictions through Unix sockets.
local all media_writer,media_validator reject
local all all trust
# Network isolation and passwords restrict clients; no Docker subnet hardcoding.
host media_auth media_writer,media_validator all scram-sha-256
host all media_writer,media_validator all reject
host all all all scram-sha-256
